---
mysql_repo_components:
  "8.4": mysql-8.4-lts
  "8.0": mysql-8.0
mysql_repo_key_url: https://repo.mysql.com/RPM-GPG-KEY-mysql-2023
mysql_packages:
  - mysql-server
  - mysql-client
mysql_socket: /var/run/mysqld/mysqld.sock
mysql_datadir: /var/lib/mysql
mysql_config_file: /etc/mysql/mysql.conf.d/zz-ha-lab.cnf
mysql_marker_file: /etc/mysql/.ha-lab-managed

# Set true to let the lab take over a MySQL datadir it did not create.
mysql_adopt_existing: false

# Fraction of total RAM; lower it (e.g. 0.25) on servers shared with other services.
mysql_buffer_pool_ratio: "{{ (lab_ha.mysql | default({})).buffer_pool_ratio | default(0.5) | float }}"
mysql_buffer_pool_mb: "{{ [128, (ansible_memtotal_mb * mysql_buffer_pool_ratio) | int] | max }}"

mysql_base_config:
  server_id: "{{ node_server_id }}"
  report_host: "{{ node_fqdn }}"
  port: "{{ mysql_port }}"
  bind_address: "*"
  # X Protocol (33060) is unused by the lab; off so only mysql.port is opened.
  mysqlx: "OFF"
  skip_name_resolve: "ON"
  max_connections: 500
  gtid_mode: "ON"
  enforce_gtid_consistency: "ON"
  log_bin: mysql-bin
  binlog_expire_logs_seconds: 604800
  innodb_buffer_pool_size: "{{ mysql_buffer_pool_mb }}M"
  innodb_flush_log_at_trx_commit: 1
  sync_binlog: 1
  slow_query_log: "ON"
  long_query_time: 1
  performance_schema: "ON"
  performance_schema_consumer_events_transactions_current: "ON"
  performance_schema_consumer_events_transactions_history: "ON"

# Unencrypted (private) networks: refuse non-TLS TCP connections. Unix-socket logins are unaffected.
mysql_network_config: "{{ {'require_secure_transport': 'ON'} if lab_unencrypted_networks | default([]) else {} }}"
mysql_effective_config: "{{ mysql_base_config | combine(mysql_network_config, mysql_config, mysql_node_config) }}"

mysql_users_session_vars:
  sql_log_bin: 0
mysql_exporter_user: exporter
mysql_replication_user: repl
mysql_benchmark_user: bench
mysql_benchmark_database: "{{ lab_benchmark.database | default('halab') }}"
# MySQL host patterns (net/mask) for every node network and allowed source; computed by the inventory plugin.
mysql_account_hosts: "{{ mysql_client_hosts }}"
