---
common_supported_os:
  Ubuntu: ["22.04", "24.04"]
  Debian: ["12"]

common_packages:
  - ca-certificates
  - curl
  - gnupg
  - python3-debian
  - python3-pymysql
  - chrony
  - ufw
  - iperf3
  - mtr-tiny
  - iputils-ping
  - sysstat
  - jq

common_firewall_manage: "{{ (lab_monitoring.firewall | default({})).manage | default(true) }}"
common_firewall_ssh_allow_all_interfaces: "{{ (lab_monitoring.firewall | default({})).ssh_allow_all_interfaces | default(true) }}"
# Every node network's cidrs plus monitoring.yml allowed_sources (computed by the inventory plugin).
common_firewall_allowed_sources: "{{ lab_allowed_sources }}"
common_firewall_extra_ports: []
common_firewall_iperf_port: 5201
common_firewall_tcp_ports: >-
  {{ (lab_mesh_tcp_ports + lab_client_tcp_ports + lab_monitoring_tcp_ports + [common_firewall_iperf_port]
      + common_firewall_extra_ports) | map('int') | unique | list }}
common_firewall_udp_ports: "{{ lab_mesh_udp_ports }}"
