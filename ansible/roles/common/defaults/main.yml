---
common_supported_os:
  Ubuntu: ["22.04", "24.04"]
  Debian: ["12"]

common_packages:
  - ca-certificates
  - curl
  - gnupg
  - python3-debian
  - python3-pymysql
  - chrony
  - ufw
  - iperf3
  - mtr-tiny
  - iputils-ping
  - sysstat
  - jq

common_firewall_manage: "{{ (lab_monitoring.firewall | default({})).manage | default(true) }}"
common_firewall_ssh_allow_all_interfaces: "{{ (lab_monitoring.firewall | default({})).ssh_allow_all_interfaces | default(true) }}"
common_firewall_allowed_sources: "{{ lab_monitoring.allowed_sources | default(['100.64.0.0/10', 'fd7a:115c:a1e0::/48']) }}"
# HA roles append their ports here (e.g. 33061 for Group Replication).
common_firewall_extra_ports: []
common_firewall_tcp_ports: "{{ [mysql_port, node_exporter_port, mysql_exporter_port] + common_firewall_extra_ports }}"
