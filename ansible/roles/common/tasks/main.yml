---
- name: Assert apt-based operating system
  ansible.builtin.assert:
    that: ansible_facts['os_family'] == 'Debian'
    fail_msg: "{{ inventory_hostname }} runs {{ ansible_facts['distribution'] }}; the lab needs an apt-based OS."
    quiet: true

- name: Warn about an untested OS release
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ inventory_hostname }} runs {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }},
      not tested (tested: {{ lab_tested_os | to_json }}).
  when: ansible_facts['distribution_version'] not in lab_tested_os[ansible_facts['distribution']] | default([])

- name: Read installed packages
  ansible.builtin.command:
    argv: [dpkg-query, -W, "-f=${db:Status-Abbrev}${Package}\\n"]
  register: common_dpkg
  changed_when: false

- name: Decide time synchronisation
  ansible.builtin.set_fact:
    common_keep_time_daemon: >-
      {{ common_other_time_daemons
         | select('in', common_dpkg.stdout_lines | select('match', '^ii') | map('regex_replace', '^ii\\s+', '') | list)
         | list | length > 0 }}

- name: Install base packages
  ansible.builtin.apt:
    name: >-
      {{ common_packages + ([] if common_keep_time_daemon else ['chrony'])
         + (['ufw'] if common_firewall_backend == 'ufw' else []) }}
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable chrony
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true
  when: not common_keep_time_daemon

- name: Configure firewall (nftables lab table)
  ansible.builtin.import_tasks: firewall-nftables.yml
  when: common_firewall_backend == 'nftables'

- name: Configure firewall (ufw)
  ansible.builtin.import_tasks: firewall-ufw.yml
  when: common_firewall_backend == 'ufw'
