---
- name: Assert supported operating system
  ansible.builtin.assert:
    that:
      - ansible_distribution in common_supported_os
      - ansible_distribution_version in common_supported_os[ansible_distribution]
    fail_msg: >-
      {{ inventory_hostname }} runs {{ ansible_distribution }} {{ ansible_distribution_version }}.
      Supported: {{ common_supported_os | to_json }}
    quiet: true

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable chrony
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

- name: Configure firewall (nftables lab table)
  ansible.builtin.import_tasks: firewall-nftables.yml
  when: common_firewall_backend == 'nftables'

- name: Configure firewall (ufw)
  ansible.builtin.import_tasks: firewall-ufw.yml
  when: common_firewall_backend == 'ufw'
