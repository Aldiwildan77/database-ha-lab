---
# Env vars win over config/secrets.yml (loaded by ansible/tasks/load-secrets.yml).
# Engine-neutral names: db_<name>_password, env LAB_DB_<NAME>_PASSWORD.
# The older mysql_<name>_password keys and LAB_MYSQL_<NAME>_PASSWORD env vars are still read.
db_exporter_password: >-
  {{ lookup('ansible.builtin.env', 'LAB_DB_EXPORTER_PASSWORD') or lookup('ansible.builtin.env', 'LAB_MYSQL_EXPORTER_PASSWORD')
     or (lab_secrets | default({})).get('db_exporter_password') or (lab_secrets | default({})).get('mysql_exporter_password', '') }}
db_replication_password: >-
  {{ lookup('ansible.builtin.env', 'LAB_DB_REPLICATION_PASSWORD') or lookup('ansible.builtin.env', 'LAB_MYSQL_REPLICATION_PASSWORD')
     or (lab_secrets | default({})).get('db_replication_password') or (lab_secrets | default({})).get('mysql_replication_password', '') }}
db_benchmark_password: >-
  {{ lookup('ansible.builtin.env', 'LAB_DB_BENCHMARK_PASSWORD') or lookup('ansible.builtin.env', 'LAB_MYSQL_BENCHMARK_PASSWORD')
     or (lab_secrets | default({})).get('db_benchmark_password') or (lab_secrets | default({})).get('mysql_benchmark_password', '') }}
db_admin_password: >-
  {{ lookup('ansible.builtin.env', 'LAB_DB_ADMIN_PASSWORD') or lookup('ansible.builtin.env', 'LAB_MYSQL_ADMIN_PASSWORD')
     or (lab_secrets | default({})).get('db_admin_password') or (lab_secrets | default({})).get('mysql_admin_password', '') }}

# Names used by the MySQL engine roles.
mysql_exporter_password: "{{ db_exporter_password }}"
mysql_replication_password: "{{ db_replication_password }}"
mysql_benchmark_password: "{{ db_benchmark_password }}"
mysql_admin_password: "{{ db_admin_password }}"
