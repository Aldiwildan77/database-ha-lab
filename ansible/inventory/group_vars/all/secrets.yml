---
# Env vars win over config/secrets.yml (loaded by ansible/tasks/load-secrets.yml).
mysql_exporter_password: >-
  {{ lookup('ansible.builtin.env', 'LAB_MYSQL_EXPORTER_PASSWORD')
     or (lab_secrets | default({})).get('mysql_exporter_password', '') }}
mysql_replication_password: >-
  {{ lookup('ansible.builtin.env', 'LAB_MYSQL_REPLICATION_PASSWORD')
     or (lab_secrets | default({})).get('mysql_replication_password', '') }}
mysql_benchmark_password: >-
  {{ lookup('ansible.builtin.env', 'LAB_MYSQL_BENCHMARK_PASSWORD')
     or (lab_secrets | default({})).get('mysql_benchmark_password', '') }}
