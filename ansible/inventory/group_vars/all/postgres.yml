---
# Names shared by the PostgreSQL engine's roles and hooks (ansible/engines/postgres).
pg_version: "{{ db_version | default('17') }}"
pg_cluster: halab
pg_port: "{{ db_port | default(15432) }}"
pg_conf_dir: "/etc/postgresql/{{ pg_version }}/{{ pg_cluster }}"
pg_data_dir: "/var/lib/postgresql/{{ pg_version }}/{{ pg_cluster }}"
pg_bin_dir: "/usr/lib/postgresql/{{ pg_version }}/bin"
pg_socket_dir: /var/run/postgresql
pg_marker_file: /etc/postgresql/.ha-lab-managed
pg_passfile: /var/lib/postgresql/.pgpass
pg_exporter_user: exporter
pg_replication_user: repl
pg_benchmark_user: bench
pg_rewind_user: rewind
pg_benchmark_database: "{{ lab_benchmark.database | default('halab') }}"

# Connection of the lab's own tasks: the postgres OS user over the local socket (peer authentication).
# Tasks that use it also set become_user: postgres.
pg_conn:
  login_unix_socket: "{{ pg_socket_dir }}"
  login_port: "{{ pg_port }}"
  login_user: postgres

# patroni strategy: names shared by the etcd and patroni roles and the hooks.
pg_patroni: "{{ lab_ha.patroni | default({}) }}"
pg_patroni_scope: "{{ pg_patroni.scope | default('halab') }}"
pg_patroni_unit: halab-patroni
pg_patroni_dir: /etc/halab/patroni
pg_patroni_config: "{{ pg_patroni_dir }}/patroni.yml"
pg_patroni_pgpass: /var/lib/postgresql/.pgpass-patroni
pg_patroni_ctl: /usr/local/sbin/halab-patronictl
# Present once Patroni runs this node's halab cluster (written by the patroni role, removed by destroy).
pg_patroni_marker: /etc/postgresql/.ha-lab-patroni
# Present when the lab installed the patroni package (destroy DATA=1 purges it only then).
pg_patroni_package_marker: /etc/postgresql/.ha-lab-patroni-package
pg_patroni_rest_port: "{{ lab_ports.patroni_rest | default(18008) }}"
pg_etcd_unit: halab-etcd
pg_etcd_conf_dir: /etc/halab/etcd
pg_etcd_pki_dir: "{{ pg_etcd_conf_dir }}/pki"
pg_etcd_data_dir: /var/lib/halab-etcd
pg_etcd_ctl: /usr/local/sbin/halab-etcdctl
pg_etcd_client_port: "{{ lab_ports.etcd_client | default(12379) }}"
pg_etcd_peer_port: "{{ lab_ports.etcd_peer | default(12380) }}"
