---
# sql_log_bin=0 keeps node-local accounts out of the binlog so they never become errant GTIDs once
# replication is configured. Every node gets the same accounts, so any node can become primary.
# root bypasses read_only through READ ONLY ADMIN, so replicas need no special handling.
- name: Create exporter account
  ansible.mysql.mysql_user:
    login_unix_socket: "{{ mariadb_socket }}"
    name: "{{ mariadb_exporter_user }}"
    host: localhost
    password: "{{ db_exporter_password }}"
    priv: "*.*:PROCESS,BINLOG MONITOR,REPLICA MONITOR,SELECT"
    resource_limits:
      MAX_USER_CONNECTIONS: 5
    session_vars: "{{ mariadb_users_session_vars }}"
    state: present
  no_log: true
  when: monitoring_enabled | bool

- name: Create replication account
  ansible.mysql.mysql_user:
    login_unix_socket: "{{ mariadb_socket }}"
    name: "{{ mariadb_replication_user }}"
    host: "{{ item }}"
    password: "{{ db_replication_password }}"
    priv: "*.*:REPLICATION SLAVE"
    session_vars: "{{ mariadb_users_session_vars }}"
    state: present
  loop: "{{ mariadb_account_hosts }}"
  no_log: true
  when: db_replication_password | length > 0

- name: Create benchmark account
  ansible.mysql.mysql_user:
    login_unix_socket: "{{ mariadb_socket }}"
    name: "{{ mariadb_benchmark_user }}"
    host: "{{ item }}"
    password: "{{ db_benchmark_password }}"
    priv: "{{ mariadb_benchmark_database }}.*:ALL"
    session_vars: "{{ mariadb_users_session_vars }}"
    state: present
  loop: "{{ mariadb_account_hosts }}"
  no_log: true
  when: db_benchmark_password | length > 0
