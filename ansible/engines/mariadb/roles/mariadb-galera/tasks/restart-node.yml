---
# (Re)starts galera_target and waits until it is Synced. The start returns after the SST or IST finished.
- name: Start the node into the cluster {{ galera_target }}
  ansible.builtin.service:
    name: mariadb
    state: restarted
  delegate_to: "{{ galera_target }}"

- name: Wait until the node is Synced {{ galera_target }}
  ansible.builtin.include_tasks: wait-synced.yml
  vars:
    galera_wait_node: "{{ galera_target }}"
