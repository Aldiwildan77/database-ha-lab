---
# MariaDB health checks. Expects lab_topo_all, lab_writable and lab_down (ansible/tasks/ha-health.yml).
- name: Check replication topology
  ansible.builtin.assert:
    that:
      - lab_down | length == 0
      - lab_writable | length == 1
      - lab_replicas_ok | length == (ansible_play_hosts_all | length) - 1
    fail_msg: >-
      Unhealthy {{ ha_provider }} topology. down={{ lab_down }} writable={{ lab_writable }}
      replicas_ok={{ lab_replicas_ok }} details={{ lab_topo_all | map(attribute='replica') | list }}
    quiet: true
  vars:
    lab_primary_fqdn: "{{ hostvars[lab_writable[0]].node_fqdn if lab_writable | length == 1 else '' }}"
    lab_replicas_ok: >-
      {{ lab_topo_all | selectattr('db_up') | selectattr('read_only')
         | selectattr('replica.source_host', 'defined')
         | selectattr('replica.source_host', 'equalto', lab_primary_fqdn)
         | selectattr('replica.io_state', 'equalto', 'ON')
         | selectattr('replica.sql_state', 'equalto', 'ON') | map(attribute='node') | list }}
  run_once: true
  when: lab_ha_strategy.family == 'replication'

- name: Check semi-sync is active on the primary
  ansible.builtin.debug:
    msg: >-
      {{ 'semi-sync active' if hostvars[lab_writable[0]].lab_topo.status.rpl_semi_sync_master_status | default('OFF') == 'ON'
         else 'WARNING: semi-sync is OFF on the primary (no semi-sync replica connected, or the timeout fell back to async)' }}
  run_once: true
  when: lab_ha_strategy.semi_sync | default(false) and lab_writable | length == 1

- name: Check Galera cluster state
  ansible.builtin.assert:
    that:
      - lab_down | length == 0
      - lab_galera_primary | length == ansible_play_hosts_all | length
      - lab_galera_synced | length == ansible_play_hosts_all | length
      - lab_topo_all | selectattr('db_up') | map(attribute='status.wsrep_cluster_size') | map('int') | unique | list == [ansible_play_hosts_all | length]
    fail_msg: >-
      {{ ('Degraded MariaDB Galera cluster: quorum held, ' ~ lab_galera_primary | length ~ ' of ' ~ ansible_play_hosts_all | length
          ~ ' nodes are in the primary component and accept writes.')
         if lab_galera_primary | length > (ansible_play_hosts_all | length) / 2
         else 'MariaDB Galera cluster without quorum: no node accepts writes (make recover NODE=<node>).' }}
      down={{ lab_down }} primary={{ lab_galera_primary }} synced={{ lab_galera_synced }}
      status={{ dict(lab_topo_all | map(attribute='node') | zip(lab_topo_all | map(attribute='status'))) }}
    quiet: true
  vars:
    lab_galera_primary: >-
      {{ lab_topo_all | selectattr('db_up') | selectattr('status.wsrep_cluster_status', 'defined')
         | selectattr('status.wsrep_cluster_status', 'equalto', 'Primary') | map(attribute='node') | list }}
    lab_galera_synced: >-
      {{ lab_topo_all | selectattr('db_up') | selectattr('status.wsrep_local_state_comment', 'defined')
         | selectattr('status.wsrep_local_state_comment', 'equalto', 'Synced') | map(attribute='node') | list }}
  run_once: true
  when: lab_ha_strategy.family == 'galera'
