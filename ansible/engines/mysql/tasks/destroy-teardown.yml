---
# MySQL hook for destroy-ha.yml. Removes the HA layer for destroy_provider and leaves standalone nodes.
- name: Stop Orchestrator
  ansible.builtin.systemd_service:
    name: orchestrator
    state: stopped
    enabled: false
  failed_when: false
  when: destroy_provider == 'orchestrator'

- name: Remove Orchestrator state
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: [/etc/orchestrator.conf.json, /var/lib/orchestrator]
  when: destroy_provider == 'orchestrator'

- name: Stop MySQL Router
  ansible.builtin.systemd_service:
    name: mysqlrouter
    state: stopped
    enabled: false
  failed_when: false
  when: destroy_provider == 'innodb-cluster'

- name: Remove MySQL Router bootstrap
  ansible.builtin.file:
    path: /etc/mysqlrouter/mysqlrouter.conf
    state: absent
  when: destroy_provider == 'innodb-cluster'

- name: Dissolve InnoDB Cluster
  ansible.builtin.command:
    argv:
      - mysqlsh
      - --js
      - --passwords-from-stdin
      - "clusteradmin@{{ node_fqdn }}:{{ mysql_port }}"
      - -e
      - "shell.options.useWizards = false; try { dba.getCluster().dissolve({force: true}); print('dissolved'); } catch (e) { print(e.message); }"
    stdin: "{{ mysql_admin_password }}"
  run_once: true
  no_log: true
  changed_when: true
  failed_when: false
  when: destroy_provider == 'innodb-cluster'

- name: Stop Group Replication and drop its persisted settings
  ansible.mysql.mysql_query:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    query:
      - STOP GROUP_REPLICATION
      - SET PERSIST group_replication_start_on_boot = OFF
  failed_when: false
  when: destroy_provider == 'innodb-cluster'

- name: Remove asynchronous replication
  ansible.mysql.mysql_query:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    query:
      - STOP REPLICA
      - RESET REPLICA ALL
  failed_when: false
  when: destroy_provider in ['async-replication', 'semi-sync', 'orchestrator']

- name: Disable semi-sync
  ansible.mysql.mysql_query:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    query:
      - SET PERSIST rpl_semi_sync_source_enabled = OFF
      - SET PERSIST rpl_semi_sync_replica_enabled = OFF
  failed_when: false
  when: destroy_provider == 'semi-sync'

- name: Make nodes standalone and writable
  ansible.mysql.mysql_query:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    query:
      - SET PERSIST super_read_only = OFF
      - SET PERSIST read_only = OFF
  failed_when: false
  when: destroy_provider != 'percona-xtradb-cluster'

- name: Refuse to dismantle Galera without destroy_data
  ansible.builtin.fail:
    msg: >-
      Percona XtraDB Cluster cannot be turned into standalone Oracle MySQL in place.
      Re-run with -e destroy_data=true to purge packages and data, or keep the cluster.
  when:
    - destroy_provider == 'percona-xtradb-cluster'
    - not (destroy_data | default(false) | bool)
