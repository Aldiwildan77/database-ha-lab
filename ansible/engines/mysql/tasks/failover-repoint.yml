---
# MySQL hook for failover.yml (manual failover). Points every reachable node at fo_new_primary.
- name: Repoint reachable nodes to the new primary
  ansible.builtin.include_role:
    name: replication
  vars:
    replication_primary: "{{ fo_new_primary }}"
  # After an unplanned failover the old primary may hold unreplicated transactions; make recover rejoins it.
  when:
    - lab_topo.db_up
    - not (failover_mode == 'failover' and inventory_hostname == old_primary)
