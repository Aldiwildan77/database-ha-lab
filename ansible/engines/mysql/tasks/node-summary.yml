---
# MySQL hook for the provisioning summary: sets lab_db_summary (shown as-is).
- name: Read MySQL status
  ansible.mysql.mysql_info:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    filter: [version, settings]
  register: summary_mysql

- name: Set summary
  ansible.builtin.set_fact:
    lab_db_summary:
      version: "{{ summary_mysql.version.full }}"
      server_id: "{{ summary_mysql.settings.server_id }}"
      gtid_mode: "{{ summary_mysql.settings.gtid_mode }}"
