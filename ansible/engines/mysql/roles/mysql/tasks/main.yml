---
- name: Refuse Oracle MySQL for Percona XtraDB Cluster
  ansible.builtin.fail:
    msg: ha_provider=percona-xtradb-cluster uses the percona-xtradb-cluster role, not the mysql role.
  when: ha_provider == 'percona-xtradb-cluster'

- name: Oracle MySQL APT packages are amd64 only
  ansible.builtin.assert:
    that: ansible_architecture == 'x86_64'
    fail_msg: "{{ inventory_hostname }} is {{ ansible_architecture }}; repo.mysql.com publishes amd64 packages only."
    quiet: true

- name: Check for an existing MySQL datadir
  ansible.builtin.stat:
    path: "{{ mysql_datadir }}/mysql.ibd"
  register: mysql_existing_datadir

- name: Check for lab ownership marker
  ansible.builtin.stat:
    path: "{{ mysql_marker_file }}"
  register: mysql_marker

- name: Protect data the lab did not create
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }} already has a MySQL datadir at {{ mysql_datadir }} that this lab did
      not create. Refusing to touch it. Re-run with -e mysql_adopt_existing=true to take it over
      (config will change and mysqld will restart; data is not deleted).
  when:
    - mysql_existing_datadir.stat.exists
    - not mysql_marker.stat.exists
    - not (mysql_adopt_existing | bool)

- name: Add MySQL APT repository
  ansible.builtin.deb822_repository:
    name: mysql
    types: deb
    uris: "http://repo.mysql.com/apt/{{ ansible_distribution | lower }}"
    suites: "{{ ansible_distribution_release }}"
    components:
      - "{{ mysql_repo_components[mysql_version] }}"
      - mysql-tools
    architectures: [amd64]
    signed_by: "{{ mysql_repo_key_url }}"
  register: mysql_repo

- name: Prefer repo.mysql.com packages over distribution packages
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/mysql
    mode: "0644"
    content: |
      Package: mysql-*
      Pin: origin repo.mysql.com
      Pin-Priority: 1001

# The package starts mysqld during install; without this it binds 3306, which may belong to another service.
- name: Create config directory before install
  ansible.builtin.file:
    path: "{{ mysql_config_file | dirname }}"
    state: directory
    mode: "0755"

- name: Set lab port before install
  ansible.builtin.copy:
    dest: "{{ mysql_config_file }}"
    mode: "0644"
    force: false
    content: "[mysqld]\nport = {{ mysql_port }}\nmysqlx = OFF\n"

# Before install, so a host left half-installed by a failed run is still recognised as the lab's.
- name: Mark datadir as lab-managed
  ansible.builtin.copy:
    dest: "{{ mysql_marker_file }}"
    mode: "0644"
    force: false
    content: "Managed by database-ha-lab. Provisioned {{ ansible_date_time.iso8601 }}\n"

- name: Install MySQL
  ansible.builtin.apt:
    name: "{{ mysql_packages }}"
    state: present
    update_cache: "{{ mysql_repo.changed }}"

- name: Write lab MySQL configuration
  ansible.builtin.template:
    src: ha-lab.cnf.j2
    dest: "{{ mysql_config_file }}"
    mode: "0644"
  notify: Restart mysql

- name: Start MySQL
  ansible.builtin.service:
    name: mysql
    state: started
    enabled: true

- name: Apply pending restart
  ansible.builtin.meta: flush_handlers

- name: Wait for MySQL socket
  ansible.builtin.wait_for:
    path: "{{ mysql_socket }}"
    timeout: 120

- name: Check root access over the Unix socket
  ansible.mysql.mysql_info:
    login_unix_socket: "{{ mysql_socket }}"
    filter: [version, settings]
  register: mysql_info
  failed_when: false

- name: Fail on missing socket authentication
  ansible.builtin.fail:
    msg: >-
      Cannot log in as root@localhost over {{ mysql_socket }}: {{ mysql_info.msg | default('') }}.
      The lab expects root to use auth_socket (the package default when no root password is set).
  when: mysql_info.version is not defined

- name: Assert effective server settings
  ansible.builtin.assert:
    that:
      - mysql_info.version.full is version(mysql_version, '>=')
      - mysql_info.version.full is version(mysql_version ~ '.999', '<=')
      - mysql_info.settings.gtid_mode == 'ON'
      - mysql_info.settings.server_id | int == node_server_id | int
      - mysql_info.settings.performance_schema | string in ['1', 'ON', 'True', 'true']
    fail_msg: "Unexpected MySQL state on {{ inventory_hostname }}: version {{ mysql_info.version.full }}"
    quiet: true

- name: Create lab accounts
  ansible.builtin.import_tasks: users.yml
