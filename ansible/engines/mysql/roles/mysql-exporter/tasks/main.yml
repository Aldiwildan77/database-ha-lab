---
- name: Require exporter password
  ansible.builtin.assert:
    that: mysql_exporter_password | length >= 16
    fail_msg: Set mysql_exporter_password (>= 16 chars) in config/secrets.yml or LAB_MYSQL_EXPORTER_PASSWORD.
    quiet: true
  no_log: true

- name: Create mysqld_exporter system user
  ansible.builtin.user:
    name: mysqld_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create install and config directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ mysqld_exporter_install_dir }}", owner: root, mode: "0755" }
    - { path: "{{ mysqld_exporter_config | dirname }}", owner: mysqld_exporter, mode: "0750" }

- name: Download mysqld_exporter (checksum verified)
  ansible.builtin.get_url:
    url: "{{ mysqld_exporter_url }}/{{ mysqld_exporter_release }}.tar.gz"
    dest: "/tmp/{{ mysqld_exporter_release }}.tar.gz"
    checksum: "sha256:{{ mysqld_exporter_url }}/sha256sums.txt"
    mode: "0644"

- name: Unpack mysqld_exporter
  ansible.builtin.unarchive:
    src: "/tmp/{{ mysqld_exporter_release }}.tar.gz"
    dest: "{{ mysqld_exporter_install_dir }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: "{{ mysqld_exporter_install_dir }}/mysqld_exporter"

- name: Link mysqld_exporter binary
  ansible.builtin.file:
    src: "{{ mysqld_exporter_install_dir }}/mysqld_exporter"
    dest: /usr/local/bin/mysqld_exporter
    state: link
  notify: Restart mysqld_exporter

- name: Write exporter credentials
  ansible.builtin.template:
    src: my.cnf.j2
    dest: "{{ mysqld_exporter_config }}"
    owner: mysqld_exporter
    group: mysqld_exporter
    mode: "0600"
  no_log: true
  notify: Restart mysqld_exporter

- name: Install mysqld_exporter unit
  ansible.builtin.template:
    src: mysqld_exporter.service.j2
    dest: /etc/systemd/system/mysqld_exporter.service
    mode: "0644"
  notify: Restart mysqld_exporter

- name: Start mysqld_exporter
  ansible.builtin.systemd_service:
    name: mysqld_exporter
    state: started
    enabled: true
    daemon_reload: true
