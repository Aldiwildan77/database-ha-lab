---
- name: Read service state
  ansible.builtin.service_facts:

- name: Read wsrep state on running nodes
  ansible.mysql.mysql_query:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    query: SHOW GLOBAL STATUS WHERE Variable_name IN ('wsrep_cluster_status', 'wsrep_cluster_size')
  register: pxc_state
  when: >-
    ansible_facts.services['mysql.service'].state | default('') == 'running'
    or ansible_facts.services['mysql@bootstrap.service'].state | default('') == 'running'
  failed_when: false

- name: Detect an existing primary component
  ansible.builtin.set_fact:
    pxc_cluster_running: >-
      {{ ansible_play_hosts_all | map('extract', hostvars, 'pxc_state') | selectattr('query_result', 'defined')
         | map(attribute='query_result') | map('first') | map('items2dict', key_name='Variable_name', value_name='Value')
         | selectattr('wsrep_cluster_status', 'equalto', 'Primary') | list | length > 0 }}
  run_once: true

- name: Bootstrap the first node
  ansible.builtin.systemd_service:
    name: mysql@bootstrap.service
    state: started
  when:
    - not pxc_cluster_running
    - inventory_hostname == pxc_bootstrap_node

- name: Wait for the bootstrap node
  ansible.builtin.wait_for:
    path: /var/run/mysqld/mysqld.sock
    timeout: 180
  when:
    - not pxc_cluster_running
    - inventory_hostname == pxc_bootstrap_node

# Joiners receive a full SST (their local datadir is replaced). Serial to avoid SST storms.
- name: Join remaining nodes one at a time
  ansible.builtin.systemd_service:
    name: mysql
    state: started
  delegate_to: "{{ item }}"
  loop: "{{ groups['db_nodes'] | difference([] if pxc_cluster_running else [pxc_bootstrap_node]) }}"
  run_once: true

- name: Switch bootstrap node to the normal service
  when:
    - not pxc_cluster_running
    - inventory_hostname == pxc_bootstrap_node
  block:
    - name: Stop bootstrap service
      ansible.builtin.systemd_service:
        name: mysql@bootstrap.service
        state: stopped
    - name: Start normal service (rejoins via IST)
      ansible.builtin.systemd_service:
        name: mysql
        state: started
        enabled: true

- name: Wait until every node is Synced
  ansible.mysql.mysql_query:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    query: SHOW GLOBAL STATUS WHERE Variable_name IN ('wsrep_local_state_comment', 'wsrep_cluster_size')
  register: pxc_sync
  until: >-
    pxc_sync.query_result is defined and
    (pxc_sync.query_result[0] | items2dict(key_name='Variable_name', value_name='Value')).wsrep_local_state_comment == 'Synced' and
    (pxc_sync.query_result[0] | items2dict(key_name='Variable_name', value_name='Value')).wsrep_cluster_size | int == groups['db_nodes'] | length
  retries: 60
  delay: 5

- name: Enable the service on every node
  ansible.builtin.systemd_service:
    name: mysql
    enabled: true

- name: Create lab accounts once (replicated by Galera)
  ansible.builtin.include_role:
    name: mysql
    tasks_from: users
    apply:
      run_once: true
      delegate_to: "{{ pxc_bootstrap_node }}"
  vars:
    mysql_users_session_vars: {}
