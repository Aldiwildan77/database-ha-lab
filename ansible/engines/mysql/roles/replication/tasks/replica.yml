---
- name: Check the replica already follows the primary
  ansible.builtin.set_fact:
    replication_in_place: >-
      {{ (replication_status.Is_Replica | default(false))
         and replication_status.Source_Host | default('') == hostvars[replication_primary].node_fqdn }}

- name: Read GTID sets for errant transaction check
  ansible.mysql.mysql_query:
    login_unix_socket: "{{ replication_socket }}"
    query: SELECT @@GLOBAL.gtid_executed AS executed
  register: replication_local_gtid
  when: not replication_in_place

- name: Find transactions the primary does not have
  ansible.mysql.mysql_query:
    login_unix_socket: "{{ replication_socket }}"
    query: SELECT GTID_SUBTRACT(%s, @@GLOBAL.gtid_executed) AS errant
    positional_args:
      - "{{ replication_local_gtid.query_result[0][0].executed }}"
  delegate_to: "{{ replication_primary }}"
  register: replication_errant
  when: not replication_in_place

- name: Refuse replicas with errant transactions
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }} has transactions the primary does not have
      ({{ replication_errant.query_result[0][0].errant }}). Replicating would diverge.
      Rebuild it from the primary with make recover NODE={{ inventory_hostname }} REBUILD=1 (discards those transactions).
  when:
    - not replication_in_place
    - replication_errant.query_result[0][0].errant | length > 0
    - not (rebuild | default(false) | bool)

- name: Rebuild from the primary
  ansible.builtin.include_tasks: clone.yml
  when:
    - not replication_in_place
    - replication_errant.query_result[0][0].errant | length > 0
    - rebuild | default(false) | bool

- name: Make replica read-only
  ansible.mysql.mysql_variables:
    login_unix_socket: "{{ replication_socket }}"
    variable: "{{ item }}"
    value: "ON"
    mode: persist
  loop: [read_only, super_read_only]

- name: Stop replication before changing source
  ansible.mysql.mysql_replication:
    login_unix_socket: "{{ replication_socket }}"
    mode: stopreplica
  when: not replication_in_place

- name: Point replica at primary
  ansible.mysql.mysql_replication:
    login_unix_socket: "{{ replication_socket }}"
    mode: changereplication
    primary_host: "{{ hostvars[replication_primary].node_fqdn }}"
    primary_port: "{{ mysql_port }}"
    primary_user: "{{ replication_user }}"
    primary_password: "{{ mysql_replication_password }}"
    primary_auto_position: true
    primary_ssl: "{{ replication_ssl | bool }}"
    primary_connect_retry: 5
  no_log: true
  when: not replication_in_place

- name: Start replication
  ansible.mysql.mysql_replication:
    login_unix_socket: "{{ replication_socket }}"
    mode: startreplica
  when: >-
    not replication_in_place
    or replication_status.Replica_IO_Running | default('') != 'Yes'
    or replication_status.Replica_SQL_Running | default('') != 'Yes'

- name: Wait for replication threads
  ansible.mysql.mysql_replication:
    login_unix_socket: "{{ replication_socket }}"
    mode: getreplica
  register: replication_check
  until:
    - replication_check.Replica_IO_Running | default('') == 'Yes'
    - replication_check.Replica_SQL_Running | default('') == 'Yes'
  retries: 20
  delay: 3
