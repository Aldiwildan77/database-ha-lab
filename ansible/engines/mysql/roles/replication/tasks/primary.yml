---
- name: Refuse a primary that is itself replicating
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }} is configured as a replica of {{ replication_status.Source_Host | default('?') }}.
      Run make destroy or failover.yml before rebuilding with it as primary.
  when: replication_status.Is_Replica | default(false)

- name: Make primary writable
  ansible.mysql.mysql_query:
    login_unix_socket: "{{ replication_socket }}"
    query:
      # Writable at runtime only; a restart comes back read-only, so a returning old primary is never a second primary.
      - SET PERSIST_ONLY read_only = ON
      - SET PERSIST_ONLY super_read_only = ON
      - SET GLOBAL super_read_only = OFF
      - SET GLOBAL read_only = OFF
  changed_when: false
