---
# patroni (from destroy-teardown.yml): stops Patroni (replicas first, so it does not fail over) and etcd, removes their
# units, configuration and the etcd data (the DCS state belongs to this deployment), and gives the halab cluster back
# to postgresql@<version>-halab.service. Data is kept; the generic steps that follow promote the standbys.
- name: Check whether Patroni runs this node
  ansible.builtin.stat:
    path: "{{ pg_patroni_marker }}"
  register: td_marker

- name: Read Patroni's role
  ansible.builtin.uri:
    url: "https://{{ node_fqdn }}:{{ pg_patroni_rest_port }}/patroni"
    ca_path: "{{ pg_etcd_pki_dir }}/ca.crt"
    return_content: true
    timeout: 5
  register: td_patroni
  failed_when: false

- name: Stop Patroni on replicas
  ansible.builtin.systemd_service:
    name: "{{ pg_patroni_unit }}"
    state: stopped
    enabled: false
  failed_when: false
  when: (td_patroni.json | default({})).role | default('') != 'primary'

- name: Stop Patroni on the leader
  ansible.builtin.systemd_service:
    name: "{{ pg_patroni_unit }}"
    state: stopped
    enabled: false
  failed_when: false

- name: Stop etcd
  ansible.builtin.systemd_service:
    name: "{{ pg_etcd_unit }}"
    state: stopped
    enabled: false
  failed_when: false

- name: Remove Patroni and etcd files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/etc/systemd/system/{{ pg_patroni_unit }}.service"
    - "/etc/systemd/system/{{ pg_etcd_unit }}.service"
    - "{{ pg_patroni_dir }}"
    - "{{ pg_patroni_ctl }}"
    - "{{ pg_patroni_pgpass }}"
    - "{{ pg_etcd_conf_dir }}"
    - "{{ pg_etcd_data_dir }}"
    - "{{ pg_etcd_ctl }}"

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Find etcd binaries
  ansible.builtin.find:
    paths: /opt
    patterns: "halab-etcd-v*"
    file_type: directory
  register: td_etcd_dirs

- name: Remove etcd binaries
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ td_etcd_dirs.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Remove the etcd user
  ansible.builtin.user:
    name: halab-etcd
    state: absent

- name: Remove the etcd group
  ansible.builtin.group:
    name: halab-etcd
    state: absent

- name: Give the cluster back to its systemd unit
  when: td_marker.stat.exists
  block:
    - name: Unmask the cluster unit
      ansible.builtin.systemd_service:
        name: "postgresql@{{ pg_version }}-{{ pg_cluster }}.service"
        masked: false
        daemon_reload: true

    - name: Start the cluster with the host
      ansible.builtin.copy:
        dest: "{{ pg_conf_dir }}/start.conf"
        content: "auto\n"
        owner: postgres
        group: postgres
        mode: "0644"

    # PostgreSQL started by pg_ctlcluster reads the configuration in /etc; these are Patroni's copies in the data dir.
    - name: Remove Patroni's files in the data directory
      ansible.builtin.file:
        path: "{{ pg_data_dir }}/{{ item }}"
        state: absent
      loop: [postgresql.conf, postgresql.conf.backup, patroni.dynamic.json]

    - name: Start the cluster
      ansible.builtin.command:
        argv: [pg_ctlcluster, "{{ pg_version }}", "{{ pg_cluster }}", start]
      register: td_start
      changed_when: td_start.rc == 0
      failed_when: td_start.rc not in [0, 2]

    - name: Wait for the PostgreSQL socket
      ansible.builtin.wait_for:
        path: "{{ pg_socket_dir }}/.s.PGSQL.{{ pg_port }}"
        timeout: 120

    - name: Remove the Patroni marker
      ansible.builtin.file:
        path: "{{ pg_patroni_marker }}"
        state: absent
