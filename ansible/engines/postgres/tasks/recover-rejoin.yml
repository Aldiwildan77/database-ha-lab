---
# PostgreSQL hook for recover.yml. Rejoins `node` to the topology led by rc_primary.
# A node that comes back as a standby is repointed. One that comes back as a primary (the old primary after an
# unplanned failover) is shut down, rewound to the new timeline with pg_rewind, and started as a standby.
# -e postgres_rebuild=true replaces its data with a fresh base backup when it cannot be rewound.
# patroni: Patroni rejoins the node itself (pg_rewind, or a new base backup with postgres_rebuild); see the last block.
- name: Rejoin the node
  vars:
    replication_primary: "{{ rc_primary }}"
  when:
    - lab_ha_strategy.family == 'replication'
    - lab_ha_strategy.failover != 'patroni'
    - inventory_hostname == node
    - rc_primary != ''
  block:
    - name: Write the postgres user's password file
      ansible.builtin.include_role:
        name: postgres-replication
        tasks_from: passfile

    - name: Read the node's state
      become: true
      become_user: postgres
      module_defaults:
        group/community.postgresql.all: "{{ pg_conn }}"
      community.postgresql.postgresql_query:
        query: SELECT pg_is_in_recovery() AS in_recovery
      register: rc_state
      changed_when: false

    - name: Rewind a node that came back as a primary
      when: not rc_state.query_result[0].in_recovery
      block:
        - name: Stop the stale primary
          ansible.builtin.command:
            argv: [pg_ctlcluster, "{{ pg_version }}", "{{ pg_cluster }}", stop, -m, fast]
          changed_when: true
          when: not (postgres_rebuild | default(false) | bool)

        - name: Rewind to the new primary
          become: true
          become_user: postgres
          ansible.builtin.command:
            argv:
              - "{{ pg_bin_dir }}/pg_rewind"
              - --target-pgdata={{ pg_data_dir }}
              - --source-server=host={{ hostvars[rc_primary].node_fqdn }} port={{ pg_port }} user={{ pg_rewind_user }} dbname=postgres sslmode=require passfile={{ pg_passfile }}
          register: rc_rewind
          changed_when: "'no rewind required' not in rc_rewind.stdout + rc_rewind.stderr"
          failed_when: false
          when: db_admin_password | length > 0 and not (postgres_rebuild | default(false) | bool)

        - name: Explain a failed rewind
          ansible.builtin.fail:
            msg: >-
              {{ inventory_hostname }} cannot be rewound onto {{ rc_primary }}
              ({{ (rc_rewind.stderr | default('db_admin_password is not set; pg_rewind needs the rewind role')) | trim }}).
              Re-run with -e postgres_rebuild=true to replace its data with a base backup of {{ rc_primary }}.
          when: not (postgres_rebuild | default(false) | bool) and (rc_rewind.rc | default(1)) != 0

        - name: Replace the data with a base backup
          ansible.builtin.include_role:
            name: postgres-replication
            tasks_from: rebuild
          vars:
            postgres_rebuild_replica: true
          when: postgres_rebuild | default(false) | bool

        - name: Start the rewound node as a standby
          ansible.builtin.include_role:
            name: postgres-replication
            tasks_from: offline
          vars:
            replication_fresh_copy: true
          when: not (postgres_rebuild | default(false) | bool)

    - name: Follow the new primary
      ansible.builtin.include_role:
        name: postgres-replication
        tasks_from: standby

- name: Rejoin the node through Patroni
  when:
    - lab_ha_strategy.failover == 'patroni'
    - inventory_hostname == node
  vars:
    rc_patroni_ok: >-
      {{ rc_patroni.json is defined and rc_patroni.json.state | default('') == 'running'
         and ((rc_patroni.json.role | default('') == 'replica' and rc_patroni.json.replication_state | default('') == 'streaming')
              or (rc_primary == '' and rc_patroni.json.role | default('') == 'primary')) }}
  block:
    - name: Start Patroni
      ansible.builtin.systemd_service:
        name: "{{ pg_patroni_unit }}"
        state: started

    - name: Reinitialise the node from the leader (postgres_rebuild)
      when: postgres_rebuild | default(false) | bool
      block:
        - name: Wait for a leader to copy from
          ansible.builtin.uri:
            url: "https://{{ node_fqdn }}:{{ pg_patroni_rest_port }}/cluster"
            ca_path: "{{ pg_etcd_pki_dir }}/ca.crt"
            return_content: true
          register: rc_cluster
          until: rc_leaders | length > 0
          retries: 20
          delay: 3
          failed_when: false
          vars:
            rc_leaders: >-
              {{ (rc_cluster.json | default({})).members | default([]) | selectattr('role', 'defined')
                 | selectattr('role', 'equalto', 'leader') | rejectattr('name', 'equalto', inventory_hostname) | list }}

        - name: Refuse a rebuild without a leader
          ansible.builtin.fail:
            msg: >-
              postgres_rebuild copies the leader, but no other member leads the cluster
              ({{ (rc_cluster.json | default({})).members | default(rc_cluster.msg | default('Patroni unreachable')) }}).
              Recover a node that can lead first (without postgres_rebuild), then rebuild this one.
          when: >-
            (rc_cluster.json | default({})).members | default([]) | selectattr('role', 'defined')
            | selectattr('role', 'equalto', 'leader') | rejectattr('name', 'equalto', inventory_hostname) | list | length == 0

        - name: Reinitialise the node
          ansible.builtin.command:
            argv: ["{{ pg_patroni_ctl }}", reinit, "{{ pg_patroni_scope }}", "{{ inventory_hostname }}", --force, --wait]
          changed_when: true

    # Without a writable node (rc_primary == ''), the recovered node may become the leader itself.
    - name: Wait until the node streams from the leader, or leads
      ansible.builtin.uri:
        url: "https://{{ node_fqdn }}:{{ pg_patroni_rest_port }}/patroni"
        ca_path: "{{ pg_etcd_pki_dir }}/ca.crt"
        return_content: true
      register: rc_patroni
      until: rc_patroni_ok
      retries: 40
      delay: 3
      failed_when: false

    - name: Explain a node that did not rejoin
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} did not rejoin as a streaming replica{{ '' if rc_primary != '' else ' or leader' }}
          (Patroni state: {{ rc_patroni.json | default(rc_patroni.msg | default('unreachable')) }}). Check journalctl -u {{ pg_patroni_unit }};
          when pg_rewind cannot repair it, re-run with -e postgres_rebuild=true to replace its data with a copy of the leader.
      when: not rc_patroni_ok
