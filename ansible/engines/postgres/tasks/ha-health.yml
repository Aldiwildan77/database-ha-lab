---
# PostgreSQL health checks. Expects lab_topo_all, lab_writable and lab_down (ansible/tasks/ha-health.yml).
- name: Check replication topology
  ansible.builtin.assert:
    that:
      - lab_down | length == 0
      - lab_writable | length == 1
      - lab_replicas_ok | length == (ansible_play_hosts_all | length) - 1
    fail_msg: >-
      Unhealthy {{ ha_provider }} topology. down={{ lab_down }} writable={{ lab_writable }}
      replicas_ok={{ lab_replicas_ok }} details={{ lab_topo_all | map(attribute='replica') | list }}
    quiet: true
  vars:
    lab_primary_fqdn: "{{ hostvars[lab_writable[0]].node_fqdn if lab_writable | length == 1 else '' }}"
    lab_replicas_ok: >-
      {{ lab_topo_all | selectattr('db_up') | selectattr('read_only')
         | selectattr('replica.source_host', 'defined')
         | selectattr('replica.source_host', 'equalto', lab_primary_fqdn)
         | selectattr('replica.io_state', 'equalto', 'ON')
         | selectattr('replica.sql_state', 'equalto', 'ON') | map(attribute='node') | list }}
  run_once: true

- name: Check synchronous replication is active on the primary
  ansible.builtin.assert:
    that: hostvars[lab_writable[0]].lab_topo.status.sync_standbys | int >= (lab_ha.sync_replication | default({})).num_sync | default(1) | int
    fail_msg: >-
      {{ lab_writable[0] }} has {{ hostvars[lab_writable[0]].lab_topo.status.sync_standbys }} synchronous standbys
      (synchronous_standby_names={{ hostvars[lab_writable[0]].lab_topo.status.synchronous_standby_names }}); commits wait until a standby acknowledges.
    quiet: true
  run_once: true
  when: lab_ha_strategy.synchronous | default(false) and lab_writable | length == 1

- name: Check Patroni and etcd
  ansible.builtin.include_tasks: "{{ lab_engine_tasks }}/patroni-health.yml"
  when: lab_ha_strategy.failover == 'patroni'
