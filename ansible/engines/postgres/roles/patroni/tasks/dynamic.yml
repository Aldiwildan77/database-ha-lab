---
# Converges the DCS settings (bootstrap.dcs applies only when the cluster is created) and restarts members that
# need it (for example after max_connections changes), one at a time, the leader last.
- name: Find the Patroni leader
  ansible.builtin.include_tasks: leader.yml
  vars:
    patroni_ask: "{{ inventory_hostname }}"

- name: Read the dynamic configuration
  ansible.builtin.uri:
    url: "https://{{ node_fqdn }}:{{ pg_patroni_rest_port }}/config"
    ca_path: "{{ patroni_ca }}"
    return_content: true
  register: patroni_config_now
  run_once: true

- name: Change the dynamic configuration
  ansible.builtin.uri:
    url: "https://{{ node_fqdn }}:{{ pg_patroni_rest_port }}/config"
    method: PATCH
    ca_path: "{{ patroni_ca }}"
    url_username: "{{ patroni_rest_user }}"
    url_password: "{{ db_admin_password }}"
    force_basic_auth: true
    body_format: json
    body: "{{ patroni_dcs }}"
  run_once: true
  changed_when: true
  no_log: true
  when: patroni_config_now.json | combine(patroni_dcs, recursive=true) != patroni_config_now.json

- name: Wait for Patroni to apply the change
  ansible.builtin.pause:
    seconds: "{{ (patroni_dcs.loop_wait | int) + 2 }}"
  when: patroni_config_now.json | combine(patroni_dcs, recursive=true) != patroni_config_now.json

- name: Restart members with pending settings
  ansible.builtin.command:
    argv: ["{{ pg_patroni_ctl }}", restart, "{{ pg_patroni_scope }}", --pending, --force]
  register: patroni_restart
  changed_when: "'Success' in patroni_restart.stdout"
  run_once: true
