---
# Under Patroni (patroni strategy) the cluster unit is masked; Patroni restarts members through its own API.
- name: Restart postgres
  ansible.builtin.command:
    argv: >-
      {{ [pg_patroni_ctl, 'restart', pg_patroni_scope, inventory_hostname, '--force']
         if postgres_patroni_marker.stat.exists | default(false)
         else ['pg_ctlcluster', pg_version, pg_cluster, 'restart'] }}
  changed_when: true

- name: Reload postgres
  ansible.builtin.command:
    argv: >-
      {{ [pg_patroni_ctl, 'reload', pg_patroni_scope, inventory_hostname, '--force']
         if postgres_patroni_marker.stat.exists | default(false)
         else ['pg_ctlcluster', pg_version, pg_cluster, 'reload'] }}
  changed_when: true
