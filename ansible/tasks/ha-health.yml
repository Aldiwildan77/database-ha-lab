---
# Runs once after topology-facts.yml. Finds writable and down nodes, then runs the engine's own checks
# (ansible/engines/<engine>/tasks/ha-health.yml), which fail with a readable reason when unhealthy.
- name: Summarise topology
  ansible.builtin.set_fact:
    lab_topo_all: "{{ ansible_play_hosts_all | map('extract', hostvars, 'lab_topo') | list }}"
  run_once: true

- name: Find writable nodes
  ansible.builtin.set_fact:
    lab_writable: >-
      {{ lab_topo_all | selectattr('db_up') | rejectattr('read_only') | map(attribute='node') | list }}
    lab_down: "{{ lab_topo_all | rejectattr('db_up') | map(attribute='node') | list }}"
  run_once: true

- name: Check health ({{ db_engine }})
  ansible.builtin.include_tasks: "{{ lab_engine_tasks }}/ha-health.yml"
