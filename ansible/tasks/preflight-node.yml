---
- name: Wait for SSH
  ansible.builtin.wait_for_connection:
    timeout: 30

- name: Gather facts
  ansible.builtin.setup:

- name: Verify sudo works
  ansible.builtin.command: "true"
  become: true
  changed_when: false

- name: Read node Tailscale status
  ansible.builtin.command: tailscale status --json
  register: node_ts
  changed_when: false
  failed_when: false
  when: node_network_type == 'tailscale'

- name: Assert Tailscale is running on the node
  ansible.builtin.assert:
    that:
      - node_ts.rc == 0
      - (node_ts.stdout | from_json).BackendState == 'Running'
    fail_msg: "Tailscale is not running on {{ inventory_hostname }} (network {{ node_network }} is type tailscale)"
    quiet: true
  when: node_network_type == 'tailscale'

- name: Find the node's address on its lab network
  ansible.builtin.set_fact:
    node_ip: >-
      {{ ((node_ts.stdout | from_json).Self.TailscaleIPs | select('match', '^\\d+\\.') | first | default(''))
         if node_network_type == 'tailscale'
         else ((ansible_facts[node_interface | replace('-', '_')] | default({})).ipv4 | default({})).address | default('') }}

- name: Check the node address belongs to its network
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -c
      - "import ipaddress,json,sys; ip=sys.argv[1]; print(any(ipaddress.ip_address(ip) in ipaddress.ip_network(c, strict=False) for c in json.loads(sys.argv[2])) if ip else False)"
      - "{{ node_ip }}"
      - "{{ node_network_cidrs | to_json }}"
  delegate_to: localhost
  become: false
  register: node_ip_check
  changed_when: false

- name: Assert the lab interface address
  ansible.builtin.assert:
    that: node_ip_check.stdout == 'True'
    fail_msg: >-
      {{ inventory_hostname }}: interface {{ node_interface }} address '{{ node_ip }}' is not inside network
      {{ node_network }} {{ node_network_cidrs }}. Fix interface/cidrs in config/inventory.yml
      (interfaces found: {{ ansible_facts.interfaces | default(['none - is iproute2 installed?']) | join(', ') }}).
    quiet: true

- name: Resolve every peer address from this node
  ansible.builtin.command:
    argv: [getent, ahosts, "{{ hostvars[item].node_address }}"]
  loop: "{{ groups['mysql_nodes'] | difference([inventory_hostname]) }}"
  register: node_peer_dns
  changed_when: false
  failed_when: node_peer_dns.rc != 0

- name: Check every peer is reachable from this node (SSH port)
  ansible.builtin.wait_for:
    host: "{{ hostvars[item].node_address }}"
    port: "{{ hostvars[item].ansible_port | default(22) }}"
    timeout: 8
  loop: "{{ groups['mysql_nodes'] | difference([inventory_hostname]) }}"

- name: Read clock synchronisation state
  ansible.builtin.command: timedatectl show --property=NTPSynchronized --value
  register: node_ntp
  changed_when: false

- name: Warn when the clock is not synchronised
  ansible.builtin.debug:
    msg: "WARNING: {{ inventory_hostname }} clock is not NTP-synchronised yet (chrony is installed by provisioning)."
  when: node_ntp.stdout | trim != 'yes'
