---
# Sets lab_topo on every host from the engine's own query (ansible/engines/<engine>/tasks/topology-facts.yml).
# Contract, same keys for every engine:
#   node, db_up (bool), error, read_only (bool or none), position (engine replication position),
#   replica ({} or {source_host, io_state, sql_state, ...}), group (list), status (dict)
- name: Read topology ({{ db_engine }})
  ansible.builtin.include_tasks: "{{ lab_engine_tasks }}/topology-facts.yml"
