---
- name: Read local Tailscale status
  ansible.builtin.command: tailscale status --json
  register: lab_ts_local
  changed_when: false
  failed_when: false
  when: lab_uses_tailscale | bool

# Informational only: reachability is decided by the TCP checks below, whatever the network.
- name: Warn when Tailscale is not running on this machine
  ansible.builtin.debug:
    msg: "WARNING: Tailscale is not running on this machine: {{ lab_ts_local.stderr | default('') | trim }}"
  when:
    - lab_uses_tailscale | bool
    - lab_ts_local.rc != 0 or (lab_ts_local.stdout | from_json).BackendState != 'Running'

- name: Resolve node addresses
  ansible.builtin.import_tasks: resolve-node-addresses.yml

- name: Check SSH reachability of every node from this machine
  ansible.builtin.wait_for:
    host: "{{ lab_node_addresses[item] }}"
    port: "{{ hostvars[item].ansible_port | default(22) }}"
    timeout: 8
  loop: "{{ groups['db_nodes'] }}"
  register: lab_reach
  failed_when: false

- name: Assert every node is reachable
  ansible.builtin.assert:
    that: item.failed is not defined or not item.failed
    fail_msg: >-
      {{ item.item }} ({{ lab_node_addresses[item.item] }}, network {{ hostvars[item.item].node_access_network }}) is not
      reachable on port {{ hostvars[item.item].ansible_port | default(22) }} from this machine. Check routing/VPN
      between this machine and that network.
    quiet: true
  loop: "{{ lab_reach.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Tailscale ping nodes on tailscale networks
  ansible.builtin.command:
    argv: [tailscale, ping, --c, "3", --timeout, 5s, "{{ hostvars[item].node_access_address }}"]
  loop: "{{ groups['db_nodes'] | map('extract', hostvars) | selectattr('node_access_network_type', 'equalto', 'tailscale')
            | map(attribute='inventory_hostname') | list }}"
  register: lab_ts_ping
  changed_when: false
  failed_when: false

- name: Warn about nodes that do not answer tailscale ping
  ansible.builtin.debug:
    msg: "WARNING: {{ item.item }} did not answer tailscale ping: {{ (item.stdout ~ ' ' ~ item.stderr) | trim }}"
  when: item.stdout is not search('pong from')
  loop: "{{ lab_ts_ping.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Report local-to-node path
  ansible.builtin.debug:
    msg: >-
      {{ item }} ({{ hostvars[item].node_network }}/{{ hostvars[item].node_network_type }}):
      {{ (lab_ts_ping.results | selectattr('item', 'equalto', item) | map(attribute='stdout_lines') | first | default([])
          | select('search', 'pong') | list | last) | default('reachable at ' ~ lab_node_addresses[item]) }}
  loop: "{{ groups['db_nodes'] }}"
