---
# Dumps the benchmark ledger for one run from every reachable node: -e run_id=<id> -e out_dir=<dir>
- name: Dump ledger
  hosts: db_nodes
  gather_facts: false
  become: true
  vars:
    db: "{{ lab_benchmark.database | default('halab') }}"
    # Per-node name: parallel fetches of one shared name can collide in out_dir.
    ledger_file: "/tmp/halab-ledger-{{ inventory_hostname }}.txt"
  tasks:
    - name: Export the run's ledger ({{ db_engine }})
      ansible.builtin.include_tasks: "{{ lab_engine_tasks }}/ledger-dump.yml"

    - name: Fetch ledger
      ansible.builtin.fetch:
        src: "{{ ledger_file }}"
        dest: "{{ out_dir }}/ledger-{{ inventory_hostname }}.txt"
        flat: true
      when: cs_dump.rc | default(1) == 0

    - name: Write node summary
      ansible.builtin.copy:
        dest: "{{ out_dir }}/ledger-{{ inventory_hostname }}.json"
        content: >-
          {{ {'node': inventory_hostname, 'reachable': cs_dump.rc | default(1) == 0,
              'error': cs_dump.stderr | default(cs_dump.msg | default('')),
              'summary': cs_dump.stdout | default('')} | to_nice_json }}
        mode: "0644"
      delegate_to: localhost
      become: false
