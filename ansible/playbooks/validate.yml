---
# Config schema is validated by the lab_config inventory plugin before this runs.
- name: Validate local configuration and connectivity
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [local]
  tasks:
    - name: Check local tools (controller, monitoring, JMeter)
      ansible.builtin.import_tasks: ../tasks/preflight-local-tools.yml
      tags: [tools]

    - name: Load secrets
      ansible.builtin.import_tasks: ../tasks/load-secrets.yml

    - name: Check required secrets
      ansible.builtin.assert:
        that: db_exporter_password | length >= 16
        fail_msg: >-
          db_exporter_password is missing or shorter than 16 characters.
          Set it in config/secrets.yml or LAB_MYSQL_EXPORTER_PASSWORD.
        quiet: true
      no_log: true
      when: monitoring_enabled | bool

    - name: Check local Tailscale, DNS and reachability
      ansible.builtin.import_tasks: ../tasks/preflight-local.yml

- name: Validate remote nodes
  hosts: db_nodes
  gather_facts: false
  tags: [remote]
  tasks:
    - name: Run node preflight
      ansible.builtin.import_tasks: ../tasks/preflight-node.yml

    - name: Assert supported OS and architecture
      ansible.builtin.assert:
        that:
          - (ansible_distribution == 'Ubuntu' and ansible_distribution_version in ['22.04', '24.04'])
            or (ansible_distribution == 'Debian' and ansible_distribution_major_version == '12')
          - ansible_architecture in lab_engine.architectures | default(['x86_64'])
        fail_msg: >-
          {{ inventory_hostname }}: {{ ansible_distribution }} {{ ansible_distribution_version }}
          {{ ansible_architecture }} is not supported (Ubuntu 22.04/24.04 or Debian 12;
          {{ db_engine }} on {{ lab_engine.architectures | default(['x86_64']) | join(', ') }}).
        quiet: true

    - name: Summary
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ok: {{ ansible_distribution }} {{ ansible_distribution_version }},
          {{ ansible_processor_vcpus }} vCPU, {{ ansible_memtotal_mb }} MB RAM,
          network {{ node_network }} ({{ node_network_type }}) {{ node_interface }} {{ node_ip }}, NTP synced={{ node_ntp.stdout | trim }}

- name: Full-mesh connectivity (routing and firewall for the selected provider)
  ansible.builtin.import_playbook: check-mesh.yml
