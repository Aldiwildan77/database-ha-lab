---
# Config schema is validated by the lab_config inventory plugin before this runs.
- name: Validate local configuration and connectivity
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [local]
  tasks:
    - name: Check local tools (controller, monitoring, JMeter)
      ansible.builtin.import_tasks: ../tasks/preflight-local-tools.yml
      tags: [tools]

    - name: Load secrets
      ansible.builtin.import_tasks: ../tasks/load-secrets.yml

    - name: Check required secrets
      ansible.builtin.assert:
        that: db_exporter_password | length >= 16
        fail_msg: >-
          db_exporter_password is missing or shorter than 16 characters.
          Set it in config/secrets.yml or LAB_MYSQL_EXPORTER_PASSWORD.
        quiet: true
      no_log: true
      when: monitoring_enabled | bool

    - name: Check local Tailscale, DNS and reachability
      ansible.builtin.import_tasks: ../tasks/preflight-local.yml

- name: Validate remote nodes
  hosts: db_nodes
  gather_facts: false
  tags: [remote]
  tasks:
    - name: Run node preflight
      ansible.builtin.import_tasks: ../tasks/preflight-node.yml

    - name: Assert supported OS and architecture
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'Debian'
          - ansible_facts['architecture'] in lab_engine.architectures | default(['x86_64'])
        fail_msg: >-
          {{ inventory_hostname }}: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
          {{ ansible_facts['architecture'] }} is not supported (apt-based OS required;
          {{ db_engine }} on {{ lab_engine.architectures | default(['x86_64']) | join(', ') }}).
        quiet: true

    - name: Warn about an untested OS release
      ansible.builtin.debug:
        msg: >-
          WARNING: {{ inventory_hostname }} runs {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }},
          not tested (tested: {{ lab_tested_os | to_json }}). Provisioning works if the {{ db_engine }} repo
          publishes '{{ ansible_facts['distribution_release'] }}'.
      when: ansible_facts['distribution_version'] not in lab_tested_os[ansible_facts['distribution']] | default([])

    - name: Summary
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ok: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }},
          {{ ansible_facts['processor_vcpus'] }} vCPU, {{ ansible_facts['memtotal_mb'] }} MB RAM,
          network {{ node_network }} ({{ node_network_type }}) {{ node_interface }} {{ node_ip }}, NTP synced={{ node_ntp.stdout | trim }}

- name: Full-mesh connectivity (routing and firewall for the selected provider)
  ansible.builtin.import_playbook: check-mesh.yml
