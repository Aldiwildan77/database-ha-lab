---
# Promote a new primary.
#   -e failover_mode=switchover   planned: old primary alive, writes are fenced first, no data loss
#   -e failover_mode=failover     unplanned: old primary dead/unreachable; may lose unreplicated transactions
#   -e new_primary=<node>         optional; default is the most advanced replica
#   -e events_file=<path>         optional; JSON list of timestamped events is written here
# Orchestrator, InnoDB Cluster and PXC fail over automatically; for them this playbook
# performs a planned switchover (or waits and records the automatic promotion).
- name: Discover topology
  hosts: db_nodes
  gather_facts: false
  become: true
  pre_tasks:
    - name: Load secrets
      ansible.builtin.import_tasks: ../tasks/load-secrets.yml
  tasks:
    - name: Validate mode
      ansible.builtin.assert:
        that: failover_mode | default('') in ['switchover', 'failover']
        fail_msg: "Pass -e failover_mode=switchover|failover"
        quiet: true
      run_once: true
      delegate_to: localhost

    - name: Read topology
      ansible.builtin.import_tasks: ../tasks/topology-facts.yml

    - name: Start event log
      ansible.builtin.set_fact:
        fo_events: "{{ [{'event': 'failover_started', 'mode': failover_mode, 'at': now(utc=true).isoformat()}] }}"
      run_once: true
      delegate_to: localhost
      delegate_facts: true

- name: Promote (async-replication, semi-sync)
  hosts: db_nodes
  gather_facts: false
  become: true
  vars:
    topo: "{{ ansible_play_hosts_all | map('extract', hostvars, 'lab_topo') | list }}"
    source_fqdns: "{{ topo | selectattr('db_up') | map(attribute='replica') | selectattr('source_host', 'defined') | map(attribute='source_host') | list }}"
    old_primary_fqdn: "{{ source_fqdns | first | default('') }}"
    old_primary: >-
      {{ groups['db_nodes'] | map('extract', hostvars) | selectattr('node_fqdn', 'equalto', old_primary_fqdn)
         | map(attribute='inventory_hostname') | first | default('') }}
    old_primary_up: "{{ old_primary != '' and hostvars[old_primary].lab_topo.db_up }}"
    # A crashed primary restarted by systemd comes back read-only: it is up but no longer serves writes.
    old_primary_writable: "{{ old_primary_up and not hostvars[old_primary].lab_topo.read_only }}"
    candidates: "{{ topo | selectattr('db_up') | selectattr('replica.source_host', 'defined') | map(attribute='node') | list }}"
  pre_tasks:
    - name: Load secrets
      ansible.builtin.import_tasks: ../tasks/load-secrets.yml
  tasks:
    - name: Skip for strategies with built-in failover
      ansible.builtin.meta: end_play
      when: lab_ha_strategy.failover != 'manual'

    - name: Check preconditions
      ansible.builtin.assert:
        that:
          - old_primary != ''
          - candidates | length > 0
          - failover_mode != 'switchover' or old_primary_up
          - failover_mode != 'failover' or not old_primary_writable or (force | default(false) | bool)
          - new_primary | default('') == '' or new_primary in candidates
        fail_msg: >-
          Cannot {{ failover_mode }}: old_primary={{ old_primary or 'unknown' }} up={{ old_primary_up }}
          writable={{ old_primary_writable }} candidates={{ candidates }} requested={{ new_primary | default('auto') }}.
          The requested node must be a running replica. An unplanned failover while the old primary is still writable risks split brain; use
          switchover, or pass -e force=true (the old primary is fenced read-only if reachable).
        quiet: true
      run_once: true

    - name: Fence, choose and promote
      block:
        - name: Fence and choose a candidate ({{ db_engine }})
          ansible.builtin.include_tasks: "{{ lab_engine_tasks }}/failover-choose.yml"

        - name: Record candidate selection
          ansible.builtin.set_fact:
            fo_events: "{{ hostvars['localhost'].fo_events + [{'event': 'candidate_selected', 'node': fo_new_primary, 'old_primary': old_primary, 'at': now(utc=true).isoformat()}] }}"
          run_once: true
          delegate_to: localhost
          delegate_facts: true

        - name: Promote ({{ db_engine }})
          ansible.builtin.include_tasks: "{{ lab_engine_tasks }}/failover-promote.yml"
      rescue:
        - name: Unfence the old primary ({{ db_engine }})
          ansible.builtin.include_tasks: "{{ lab_engine_tasks }}/failover-unfence.yml"

        - name: Stop after failed promotion
          ansible.builtin.fail:
            msg: "{{ failover_mode }} aborted: {{ ansible_failed_result.msg | default('see previous error') }}"

    - name: Record promotion
      ansible.builtin.set_fact:
        fo_events: "{{ hostvars['localhost'].fo_events + [{'event': 'primary_promoted', 'node': fo_new_primary, 'at': now(utc=true).isoformat()}] }}"
      run_once: true
      delegate_to: localhost
      delegate_facts: true

    - name: Repoint reachable nodes ({{ db_engine }})
      ansible.builtin.include_tasks: "{{ lab_engine_tasks }}/failover-repoint.yml"

    - name: Record repoint
      ansible.builtin.set_fact:
        fo_events: "{{ hostvars['localhost'].fo_events + [{'event': 'replicas_repointed', 'at': now(utc=true).isoformat()}] }}"
      run_once: true
      delegate_to: localhost
      delegate_facts: true

- name: Switchover (strategies with an HA manager)
  hosts: db_nodes
  gather_facts: false
  become: true
  pre_tasks:
    - name: Load secrets
      ansible.builtin.import_tasks: ../tasks/load-secrets.yml
  tasks:
    - name: Skip strategies without an HA manager
      ansible.builtin.meta: end_play
      when: lab_ha_strategy.failover == 'manual'

    - name: Planned switchover ({{ db_engine }})
      ansible.builtin.include_tasks: "{{ lab_engine_tasks }}/switchover-managed.yml"
      when: failover_mode == 'switchover'

    - name: Wait for automatic promotion
      ansible.builtin.pause:
        seconds: "{{ auto_failover_wait | default(lab_ha_strategy.auto_failover_wait | default(5)) }}"
      when: failover_mode == 'failover'

- name: Verify and write events
  hosts: db_nodes
  gather_facts: false
  tasks:
    - name: Re-read topology
      ansible.builtin.import_tasks: ../tasks/topology-facts.yml

    - name: Record final state
      ansible.builtin.set_fact:
        fo_events: >-
          {{ hostvars['localhost'].fo_events + [{'event': 'failover_finished', 'at': now(utc=true).isoformat(),
             'writable': ansible_play_hosts_all | map('extract', hostvars, 'lab_topo') | selectattr('db_up') | rejectattr('read_only') | map(attribute='node') | list}] }}
      run_once: true
      delegate_to: localhost
      delegate_facts: true

    - name: Ensure events directory
      ansible.builtin.file:
        path: "{{ (events_file | default(lab_root ~ '/local/state/x')) | dirname }}"
        state: directory
        mode: "0755"
      run_once: true
      delegate_to: localhost

    - name: Write events file
      ansible.builtin.copy:
        dest: "{{ events_file | default(lab_root ~ '/local/state/failover-' ~ now(utc=true).strftime('%Y%m%dT%H%M%SZ') ~ '.json') }}"
        content: "{{ hostvars['localhost'].fo_events | to_nice_json }}\n"
        mode: "0644"
      run_once: true
      delegate_to: localhost

    - name: Show events
      ansible.builtin.debug:
        var: hostvars['localhost'].fo_events
      run_once: true
