---
# Bring a failed node back into the topology: -e node=<name>
- name: Start the database on the recovering node
  tags: [start-db, start-mysql]
  hosts: "{{ node | default('none') }}"
  gather_facts: false
  become: true
  tasks:
    # A Galera node cannot start while no peer holds a primary component; the rejoin hook starts it.
    - name: Start the database service
      ansible.builtin.service:
        name: "{{ lab_db_service_unit }}"
        state: started
      when: lab_ha_strategy.family != 'galera'

- name: Rejoin
  hosts: db_nodes
  gather_facts: false
  become: true
  pre_tasks:
    - name: Load secrets
      ansible.builtin.import_tasks: ../tasks/load-secrets.yml
  tasks:
    - name: Read topology
      ansible.builtin.import_tasks: ../tasks/topology-facts.yml

    - name: Find current primary
      ansible.builtin.set_fact:
        rc_primary: >-
          {{ ansible_play_hosts_all | map('extract', hostvars, 'lab_topo') | selectattr('db_up')
             | rejectattr('read_only') | map(attribute='node') | difference([node]) | first | default('') }}
      run_once: true

    - name: Rejoin ({{ db_engine }})
      ansible.builtin.include_tasks: "{{ lab_engine_tasks }}/recover-rejoin.yml"
      when:
        - inventory_hostname == node
        # Strategies whose HA manager rejoins the node (or elects a leader) run the hook without a writable node.
        - rc_primary != '' or lab_ha_strategy.family == 'galera' or lab_ha_strategy.rejoin_without_primary | default(false)

- name: Verify topology
  ansible.builtin.import_playbook: topology.yml
