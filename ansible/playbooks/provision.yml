---
- name: Preflight (local)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Load secrets
      ansible.builtin.import_tasks: ../tasks/load-secrets.yml
    - name: Check local Tailscale, DNS and reachability
      ansible.builtin.import_tasks: ../tasks/preflight-local.yml

- name: Host impact check (read-only; stops on conflicts)
  ansible.builtin.import_playbook: check-host.yml

- name: Provision database nodes
  hosts: db_nodes
  gather_facts: false
  become: true
  pre_tasks:
    - name: Load secrets
      ansible.builtin.import_tasks: ../tasks/load-secrets.yml
    - name: Run node preflight
      ansible.builtin.import_tasks: ../tasks/preflight-node.yml
  roles:
    - common
  tasks:
    - name: Install database engine for the selected layout
      ansible.builtin.include_role:
        name: "{{ ha_step.role }}"
        tasks_from: "{{ ha_step.tasks_from | default('main') }}"
      loop: "{{ lab_ha_strategy.provision }}"
      loop_control:
        loop_var: ha_step
        label: "{{ ha_step.role }}:{{ ha_step.tasks_from | default('main') }}"

- name: Install exporters
  ansible.builtin.import_playbook: configure-exporters.yml

- name: Full-mesh connectivity with firewall and database in place
  ansible.builtin.import_playbook: check-mesh.yml

- name: Provisioning summary
  hosts: db_nodes
  gather_facts: false
  become: true
  tasks:
    - name: Read server summary ({{ db_engine }})
      ansible.builtin.include_tasks: "{{ lab_engine_tasks }}/node-summary.yml"

    - name: Read clock offset
      ansible.builtin.command: chronyc -c tracking
      register: summary_chrony
      changed_when: false
      failed_when: false

    - name: Show summary
      ansible.builtin.debug:
        msg:
          node: "{{ inventory_hostname }}"
          fqdn: "{{ node_fqdn }}"
          datacenter: "{{ node_datacenter }}"
          role: "{{ node_role }}"
          db_engine: "{{ db_engine }}"
          db: "{{ lab_db_summary }}"
          clock_offset_seconds: "{{ (summary_chrony.stdout.split(','))[4] | default('n/a') }}"
