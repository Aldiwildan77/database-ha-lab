---
- name: Preflight (local)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Load secrets
      ansible.builtin.import_tasks: ../tasks/load-secrets.yml
    - name: Check local Tailscale, DNS and reachability
      ansible.builtin.import_tasks: ../tasks/preflight-local.yml

- name: Provision MySQL nodes
  hosts: mysql_nodes
  gather_facts: false
  become: true
  pre_tasks:
    - name: Load secrets
      ansible.builtin.import_tasks: ../tasks/load-secrets.yml
    - name: Run node preflight
      ansible.builtin.import_tasks: ../tasks/preflight-node.yml
  roles:
    - common
  tasks:
    - name: Install Oracle MySQL
      ansible.builtin.include_role:
        name: mysql
      when: ha_provider != 'percona-xtradb-cluster'

    - name: Install Percona XtraDB Cluster
      ansible.builtin.include_role:
        name: percona-xtradb-cluster
      when: ha_provider == 'percona-xtradb-cluster'

    - name: Form Percona XtraDB Cluster
      ansible.builtin.include_role:
        name: percona-xtradb-cluster
        tasks_from: cluster
      when: ha_provider == 'percona-xtradb-cluster'

- name: Install exporters
  ansible.builtin.import_playbook: configure-exporters.yml

- name: Full-mesh connectivity with firewall and MySQL in place
  ansible.builtin.import_playbook: check-mesh.yml

- name: Provisioning summary
  hosts: mysql_nodes
  gather_facts: false
  become: true
  tasks:
    - name: Read MySQL status
      ansible.mysql.mysql_info:
        login_unix_socket: /var/run/mysqld/mysqld.sock
        filter: [version, settings]
      register: summary_mysql

    - name: Read clock offset
      ansible.builtin.command: chronyc -c tracking
      register: summary_chrony
      changed_when: false

    - name: Show summary
      ansible.builtin.debug:
        msg:
          node: "{{ inventory_hostname }}"
          fqdn: "{{ node_fqdn }}"
          datacenter: "{{ node_datacenter }}"
          role: "{{ node_role }}"
          mysql: "{{ summary_mysql.version.full }}"
          server_id: "{{ summary_mysql.settings.server_id }}"
          gtid_mode: "{{ summary_mysql.settings.gtid_mode }}"
          clock_offset_seconds: "{{ (summary_chrony.stdout.split(','))[4] | default('n/a') }}"
