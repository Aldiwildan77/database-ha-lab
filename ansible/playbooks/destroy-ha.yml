---
# Removes the HA topology. Data is kept unless -e destroy_data=true.
# Requires -e confirm=<environment name> (make destroy asks for it).
- name: Confirm
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Require confirmation
      ansible.builtin.assert:
        that: confirm | default('') == lab_environment
        fail_msg: "Pass -e confirm={{ lab_environment }} to destroy the {{ ha_provider }} topology."
        quiet: true

- name: Tear down HA provider
  hosts: db_nodes
  gather_facts: true
  become: true
  pre_tasks:
    - name: Load secrets
      ansible.builtin.import_tasks: ../tasks/load-secrets.yml
  tasks:
    - name: Read deployed provider
      ansible.builtin.slurp:
        src: "{{ lab_engine.marker_dir }}/.ha-lab-provider"
      register: deployed
      failed_when: false

    - name: Set provider being removed
      ansible.builtin.set_fact:
        destroy_provider: "{{ (deployed.content | b64decode | trim) if deployed.content is defined else ha_provider }}"

    - name: Tear down the deployed provider ({{ db_engine }})
      ansible.builtin.include_tasks: "{{ lab_engine_tasks }}/destroy-teardown.yml"

    - name: Remove provider marker
      ansible.builtin.file:
        path: "{{ lab_engine.marker_dir }}/.ha-lab-provider"
        state: absent

- name: Purge the database and data (destroy_data=true)
  hosts: db_nodes
  gather_facts: false
  become: true
  tasks:
    - name: Skip unless requested
      ansible.builtin.meta: end_play
      when: not (destroy_data | default(false) | bool)

    - name: Stop the server and purge packages and data ({{ db_engine }})
      ansible.builtin.include_tasks: "{{ lab_engine_tasks }}/destroy-purge.yml"

    - name: Remove lab firewall table
      ansible.builtin.systemd_service:
        name: halab-firewall
        state: stopped
        enabled: false
      failed_when: false

    - name: Delete lab firewall config and markers
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/halab
        - /etc/systemd/system/halab-firewall.service
