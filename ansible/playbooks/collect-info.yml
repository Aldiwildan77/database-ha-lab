---
- name: Collect node information
  hosts: mysql_nodes
  gather_facts: true
  become: true
  tasks:
    - name: Read MySQL version
      ansible.mysql.mysql_info:
        login_unix_socket: /var/run/mysqld/mysqld.sock
        filter: [version]
      register: info_mysql
      failed_when: false

    - name: Read chrony tracking
      ansible.builtin.command: chronyc -c tracking
      register: info_chrony
      changed_when: false
      failed_when: false

    - name: Read Tailscale IPs
      ansible.builtin.command: tailscale ip
      register: info_ts
      changed_when: false
      failed_when: false
      when: node_network_type == 'tailscale'

    - name: Build node record
      ansible.builtin.set_fact:
        node_info:
          node: "{{ inventory_hostname }}"
          fqdn: "{{ node_fqdn }}"
          datacenter: "{{ node_datacenter }}"
          role: "{{ node_role }}"
          os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
          kernel: "{{ ansible_kernel }}"
          arch: "{{ ansible_architecture }}"
          vcpus: "{{ ansible_processor_vcpus }}"
          cpu_model: "{{ ansible_processor[2] | default(ansible_processor | last) }}"
          memory_mb: "{{ ansible_memtotal_mb }}"
          disks: "{{ ansible_devices.keys() | reject('match', '^(loop|ram|sr|dm-)') | list }}"
          network: "{{ node_network }}"
          network_type: "{{ node_network_type }}"
          interface: "{{ node_interface }}"
          interface_ipv4: "{{ (ansible_facts[node_interface | replace('-', '_')] | default({})).ipv4.address | default('') }}"
          tailscale_ips: "{{ info_ts.stdout_lines | default([]) }}"
          mysql_version: "{{ info_mysql.version.full | default('not installed') }}"
          clock_synced: "{{ (info_chrony.stdout.split(','))[13] | default('') | trim == 'Normal' }}"
          clock_offset_seconds: "{{ (info_chrony.stdout.split(','))[4] | default('n/a') }}"
          collected_at: "{{ ansible_date_time.iso8601 }}"

- name: Write node information file
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Write local/state/node-info.json
      ansible.builtin.copy:
        dest: "{{ lab_root }}/local/state/node-info.json"
        mode: "0644"
        content: "{{ groups['mysql_nodes'] | map('extract', hostvars, 'node_info') | list | to_nice_json }}\n"

    - name: Show node information
      ansible.builtin.debug:
        msg: "{{ groups['mysql_nodes'] | map('extract', hostvars, 'node_info') | list }}"
