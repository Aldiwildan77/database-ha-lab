---
- name: Collect node information
  hosts: db_nodes
  gather_facts: true
  become: true
  tasks:
    - name: Read server version ({{ db_engine }})
      ansible.builtin.include_tasks: "{{ lab_engine_tasks }}/server-version.yml"

    - name: Read chrony tracking
      ansible.builtin.command: chronyc -c tracking
      register: info_chrony
      changed_when: false
      failed_when: false

    - name: Read Tailscale IPs
      ansible.builtin.command: tailscale ip
      register: info_ts
      changed_when: false
      failed_when: false
      when: node_network_type == 'tailscale'

    - name: Build node record
      ansible.builtin.set_fact:
        node_info:
          node: "{{ inventory_hostname }}"
          fqdn: "{{ node_fqdn }}"
          datacenter: "{{ node_datacenter }}"
          role: "{{ node_role }}"
          os: "{{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
          kernel: "{{ ansible_facts['kernel'] }}"
          arch: "{{ ansible_facts['architecture'] }}"
          vcpus: "{{ ansible_facts['processor_vcpus'] }}"
          cpu_model: "{{ ansible_facts['processor'][2] | default(ansible_facts['processor'] | last) }}"
          memory_mb: "{{ ansible_facts['memtotal_mb'] }}"
          disks: "{{ ansible_facts['devices'].keys() | reject('match', '^(loop|ram|sr|dm-)') | list }}"
          network: "{{ node_network }}"
          network_type: "{{ node_network_type }}"
          interface: "{{ node_interface }}"
          interface_ipv4: "{{ (ansible_facts[node_interface | replace('-', '_')] | default({})).ipv4.address | default('') }}"
          tailscale_ips: "{{ info_ts.stdout_lines | default([]) }}"
          db_engine: "{{ db_engine }}"
          db_version: "{{ lab_db_version | default('not installed') }}"
          clock_synced: "{{ (info_chrony.stdout.split(','))[13] | default('') | trim == 'Normal' }}"
          clock_offset_seconds: "{{ (info_chrony.stdout.split(','))[4] | default('n/a') }}"
          collected_at: "{{ ansible_facts['date_time'].iso8601 }}"

- name: Write node information file
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Write local/state/node-info.json
      ansible.builtin.copy:
        dest: "{{ lab_root }}/local/state/node-info.json"
        mode: "0644"
        content: "{{ groups['db_nodes'] | map('extract', hostvars, 'node_info') | list | to_nice_json }}\n"

    - name: Show node information
      ansible.builtin.debug:
        msg: "{{ groups['db_nodes'] | map('extract', hostvars, 'node_info') | list }}"
