---
- name: Preflight
  hosts: db_nodes
  gather_facts: true
  become: true
  any_errors_fatal: true
  pre_tasks:
    - name: Load secrets
      ansible.builtin.import_tasks: ../tasks/load-secrets.yml
  tasks:
    - name: Require enough nodes for the provider
      ansible.builtin.assert:
        that: groups['db_nodes'] | length >= lab_ha_min_nodes | int
        fail_msg: "{{ ha_provider }} needs at least {{ lab_ha_min_nodes }} nodes; inventory has {{ groups['db_nodes'] | length }}."
        quiet: true
      run_once: true

    - name: Read deployed provider marker
      ansible.builtin.slurp:
        src: "{{ lab_engine.marker_dir }}/.ha-lab-provider"
      register: deployed_provider
      failed_when: false

    - name: Refuse switching providers in place
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} runs {{ deployed_provider.content | b64decode | trim }}, config asks for
          {{ ha_provider }}. Run make destroy first; switching topologies in place is not supported.
      when:
        - deployed_provider.content is defined
        - deployed_provider.content | b64decode | trim != ha_provider

    - name: Require provisioned nodes
      ansible.builtin.stat:
        path: "{{ lab_engine.marker_dir }}/.ha-lab-managed"
      register: provisioned
      failed_when: not provisioned.stat.exists

- name: Full-mesh connectivity before building the topology
  ansible.builtin.import_playbook: check-mesh.yml

- name: Deploy HA provider
  hosts: db_nodes
  gather_facts: false
  become: true
  any_errors_fatal: true
  pre_tasks:
    - name: Load secrets
      ansible.builtin.import_tasks: ../tasks/load-secrets.yml
  tasks:
    - name: Open provider ports
      ansible.builtin.include_role:
        name: common
        tasks_from: firewall
      when: lab_monitoring.firewall.manage | default(true) | bool

    - name: Deploy {{ ha_provider }}
      ansible.builtin.include_role:
        name: "{{ ha_step.role }}"
        tasks_from: "{{ ha_step.tasks_from | default('main') }}"
      loop: "{{ lab_ha_strategy.deploy }}"
      loop_control:
        loop_var: ha_step
        label: "{{ ha_step.role }}:{{ ha_step.tasks_from | default('main') }}"

    - name: Record deployed provider
      ansible.builtin.copy:
        dest: "{{ lab_engine.marker_dir }}/.ha-lab-provider"
        content: "{{ ha_provider }}\n"
        mode: "0644"

- name: Verify topology
  ansible.builtin.import_playbook: topology.yml
