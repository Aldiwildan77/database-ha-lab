---
- name: Install exporters on MySQL nodes
  hosts: db_nodes
  gather_facts: true
  become: true
  pre_tasks:
    - name: Load secrets
      ansible.builtin.import_tasks: ../tasks/load-secrets.yml
    - name: Skip when monitoring is disabled
      ansible.builtin.meta: end_play
      when: not (monitoring_enabled | bool)
  roles:
    - node-exporter
  tasks:
    - name: Install the database exporter
      ansible.builtin.include_role:
        name: "{{ db_exporter_role }}"

    - name: Install the lab collector
      ansible.builtin.include_role:
        name: lab-collector

- name: Verify exporters from this machine over Tailscale
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Resolve node addresses
      ansible.builtin.import_tasks: ../tasks/resolve-node-addresses.yml

    - name: Scrape exporters
      ansible.builtin.uri:
        url: "http://{{ addr }}:{{ item.1 }}/metrics"
        return_content: true
        timeout: 10
      vars:
        addr: "{{ ('[' ~ lab_node_addresses[item.0] ~ ']') if ':' in lab_node_addresses[item.0] else lab_node_addresses[item.0] }}"
      loop: "{{ groups['db_nodes'] | product([node_exporter_port, db_exporter_port, lab_collector_port]) | list }}"
      loop_control:
        label: "{{ item.0 }}:{{ item.1 }}"
      register: exporter_scrape
      when: monitoring_enabled | bool

    - name: Assert the database exporter can reach the database
      ansible.builtin.assert:
        that: item.content is search('(?m)^' ~ db_exporter_up_metric ~ ' 1')
        fail_msg: "{{ item.item.0 }}: {{ db_exporter_name }} reports {{ db_exporter_up_metric }} != 1 (check exporter credentials)"
        quiet: true
      loop: "{{ exporter_scrape.results | selectattr('item.1', 'equalto', db_exporter_port) | list }}"
      loop_control:
        label: "{{ item.item.0 }}"
      when: monitoring_enabled | bool
