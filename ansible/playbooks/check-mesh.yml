---
# Full-mesh connectivity check for the selected HA provider.
#   node -> every peer: TCP on lab_mesh_tcp_ports (database, GR, Galera, orchestrator ...)
#   node -> every peer: database login as the replication account over TLS (engine hook mesh-login, when the database runs)
#   this machine -> every node: client ports (database / proxy) and monitoring ports
# Ports with no service yet get a temporary listener, so routing and firewall rules are tested
# before the database or the HA software exists.
- name: Prepare temporary listeners
  hosts: db_nodes
  gather_facts: false
  become: true
  vars:
    mesh_all_ports: "{{ (lab_mesh_tcp_ports + lab_client_tcp_ports + lab_monitoring_tcp_ports) | map('int') | unique | list }}"
  tasks:
    - name: Find ports already served
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, socket, sys
            out = {}
            for p in json.loads(sys.argv[1]):
                s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                try:
                    s.bind(("0.0.0.0", p)); out[p] = "free"
                except OSError:
                    out[p] = "service"
                finally:
                    s.close()
            print(json.dumps(out))
          - "{{ mesh_all_ports | to_json }}"
      register: mesh_bind
      changed_when: false

    - name: Record port state
      ansible.builtin.set_fact:
        mesh_port_state: "{{ mesh_bind.stdout | from_json }}"

    - name: Start temporary listeners on free ports
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            # halab-port-listener
            import json, selectors, socket, sys, time
            sel, end = selectors.DefaultSelector(), time.time() + int(sys.argv[2])
            for p in json.loads(sys.argv[1]):
                s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                s.bind(("0.0.0.0", p)); s.listen(64); s.setblocking(False)
                sel.register(s, selectors.EVENT_READ)
            while time.time() < end:
                for key, _ in sel.select(timeout=0.5):
                    try:
                        c, _ = key.fileobj.accept(); c.close()
                    except OSError:
                        pass
          - "{{ mesh_port_state | dict2items | selectattr('value', 'equalto', 'free') | map(attribute='key') | map('int') | list | to_json }}"
          - "{{ mesh_listener_seconds | default(120) }}"
      async: "{{ (mesh_listener_seconds | default(120) | int) + 30 }}"
      poll: 0
      changed_when: false
      when: mesh_port_state.values() | select('equalto', 'free') | list | length > 0

    - name: Give listeners a moment to bind
      ansible.builtin.wait_for:
        timeout: 2
      delegate_to: localhost
      become: false
      run_once: true

- name: Check node-to-node mesh
  hosts: db_nodes
  gather_facts: false
  become: true
  vars:
    mesh_nodes: "{{ groups['db_nodes'] | map('extract', hostvars) | selectattr('mesh_port_state', 'defined') | map(attribute='inventory_hostname') | list }}"
  pre_tasks:
    - name: Load secrets
      ansible.builtin.import_tasks: ../tasks/load-secrets.yml
  tasks:
    - name: TCP connect to every peer port
      ansible.builtin.wait_for:
        host: "{{ hostvars[item.0].node_address }}"
        port: "{{ item.1 }}"
        timeout: 5
      loop: "{{ mesh_nodes | difference([inventory_hostname]) | product(lab_mesh_tcp_ports) | list }}"
      loop_control:
        label: "{{ inventory_hostname }} -> {{ item.0 }}:{{ item.1 }}"
      register: mesh_tcp
      failed_when: false

    - name: Database login to every peer over TLS ({{ db_engine }})
      ansible.builtin.include_tasks: "{{ lab_engine_tasks }}/mesh-login.yml"

    - name: Summarise node failures
      ansible.builtin.set_fact:
        mesh_failures: >-
          {%- set out = [] -%}
          {%- for r in mesh_tcp.results if r.msg is defined -%}
          {%- set _ = out.append(inventory_hostname ~ ' -> ' ~ r.item.0 ~ ':' ~ r.item.1 ~ ' TCP unreachable') -%}
          {%- endfor -%}
          {%- for r in mesh_login.results | default([]) if not (r.skipped | default(false)) and r.rc | default(1) != 0 -%}
          {%- set _ = out.append(inventory_hostname ~ ' -> ' ~ r.item ~ ' database login failed: '
                ~ (r.stderr | default(r.msg | default('')) | regex_replace('mysql: \\[Warning\\][^\\n]*\\n?', '') | trim)) -%}
          {%- endfor -%}
          {{ out }}

- name: Check this machine to nodes
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mesh_nodes: "{{ groups['db_nodes'] | map('extract', hostvars) | selectattr('mesh_port_state', 'defined') | map(attribute='inventory_hostname') | list }}"
  tasks:
    - name: Local checks
      block:
        - name: Resolve node addresses
          ansible.builtin.import_tasks: ../tasks/resolve-node-addresses.yml

        - name: TCP connect to client and monitoring ports
          ansible.builtin.wait_for:
            host: "{{ lab_node_addresses[item.0] }}"
            port: "{{ item.1 }}"
            timeout: 5
          loop: "{{ mesh_nodes | product(lab_client_tcp_ports + lab_monitoring_tcp_ports) | list }}"
          loop_control:
            label: "local -> {{ item.0 }}:{{ item.1 }}"
          register: mesh_local
          failed_when: false
      rescue:
        - name: Record local failure
          ansible.builtin.set_fact:
            mesh_local_error: >-
              local: {{ (ansible_failed_result.results | default([]) | selectattr('failed', 'defined') | selectattr('failed')
                        | map(attribute='msg') | list | join(' | ')) or ansible_failed_result.msg | default('check failed') }}

- name: Stop temporary listeners
  hosts: db_nodes
  gather_facts: false
  become: true
  tasks:
    - name: Kill listeners
      ansible.builtin.command: pkill -f halab-port-listener
      register: mesh_kill
      changed_when: mesh_kill.rc == 0
      failed_when: false

- name: Verdict
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Show results
      ansible.builtin.debug:
        msg: >-
          node-to-node: {{ (groups['db_nodes'] | length) * (groups['db_nodes'] | length - 1) }} pairs x
          TCP {{ lab_mesh_tcp_ports }}, plus database TLS login where the database runs;
          local-to-node: TCP {{ lab_client_tcp_ports + lab_monitoring_tcp_ports }}.
          {{ ('UDP ' ~ lab_mesh_udp_ports ~ ' cannot be verified by TCP connect; confirm those firewall rules manually.') if lab_mesh_udp_ports else '' }}

    - name: Assert full mesh
      ansible.builtin.assert:
        that: lab_all_failures | length == 0
        fail_msg: "Connectivity problems:\n{{ lab_all_failures | join('\n') }}"
        success_msg: "Full mesh OK"
      vars:
        lab_all_failures: >-
          {{ (groups['db_nodes'] | map('extract', hostvars, 'mesh_failures') | select('defined') | flatten)
             + ([mesh_local_error] if mesh_local_error is defined else [])
             + (mesh_local.results | default([]) | selectattr('msg', 'defined')
                | map(attribute='item') | map('join', ':') | map('regex_replace', '^', 'local -> ')
                | map('regex_replace', '$', ' TCP unreachable (add this machine to monitoring.yml allowed_sources?)') | list) }}
