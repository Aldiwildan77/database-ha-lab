global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

# Targets are generated from config/inventory.yml by `make targets`.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: node
    file_sd_configs:
      - files: [/etc/prometheus/targets/node.json]

  - job_name: mysqld
    file_sd_configs:
      - files: [/etc/prometheus/targets/mysqld.json]
