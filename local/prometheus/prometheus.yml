global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml
  - /etc/prometheus/recording-rules/*.yml

# Targets are generated from config/inventory.yml by `make targets`.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: node
    file_sd_configs:
      - files: [/etc/prometheus/targets/node.json]

  - job_name: db
    file_sd_configs:
      - files: [/etc/prometheus/targets/db.json]

  - job_name: halab
    file_sd_configs:
      - files: [/etc/prometheus/targets/halab.json]

  # Processes on this machine (benchmark/runner/jtl_exporter.py, metrics/collectors/local_probe.py).
  - job_name: benchmark
    scrape_interval: 5s
    static_configs:
      - targets: [host.docker.internal:9464]
  - job_name: local_probe
    static_configs:
      - targets: [host.docker.internal:9465]
        labels:
          source: client
