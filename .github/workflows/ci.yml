name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      LAB_CONFIG_DIR: ci-config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Tools
        run: |
          pip install ansible-core ansible-lint yamllint pyyaml
          sudo apt-get install -y shellcheck
          ansible-galaxy collection install -r requirements.yml -p ansible/collections
          make local/compose/.env
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
          mkdir ci-config
          for f in ha benchmark monitoring secrets; do cp config/$f.example.yml ci-config/$f.yml; done
          printf '%s\n' 'environment: {name: ci, network: lan}' 'networks:' \
            '  lan: {type: private, interface: eth1, cidrs: [10.20.0.0/24]}' 'nodes:' > ci-config/inventory.yml
          for i in 1 2 3; do
            printf '%s\n' "  - name: db-0$i" "    address: 10.20.0.1$i" "    ssh: {user: ci, private_key: ~/.ssh/id_ed25519}" \
              "    role: $([ $i = 1 ] && echo primary || echo replica)" "    datacenter: dc-1" >> ci-config/inventory.yml
          done
      - name: Unit tests
        run: make test
      - name: Lint
        run: make lint
      - name: Config and playbook syntax
        run: |
          make validate-config
          for p in ansible/playbooks/*.yml; do ansible-playbook --syntax-check "$p"; done
      - name: JMeter plans and scripts
        run: |
          make jmeter-install
          python3 jmeter/build-scenarios.py
          git diff --exit-code jmeter/scenarios
          java -cp "local/tools/jmeter/lib/*" org.codehaus.groovy.tools.FileSystemCompiler -d /tmp/groovy \
            jmeter/scripts/LabDb.groovy jmeter/scripts/transaction.groovy jmeter/scripts/prepare.groovy
