# Copy to config/secrets.yml, then: ansible-vault encrypt config/secrets.yml
# Env vars override: LAB_MYSQL_<NAME>_PASSWORD (e.g. LAB_MYSQL_EXPORTER_PASSWORD).
# Minimum 16 characters. Avoid quotes and backslashes.
mysql_exporter_password: ""
mysql_replication_password: ""     # async-replication, semi-sync, orchestrator
mysql_benchmark_password: ""       # JMeter user
mysql_admin_password: ""           # innodb-cluster clusteradmin, orchestrator topology user
