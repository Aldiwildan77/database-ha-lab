---
# Copy to config/secrets.yml, then: ansible-vault encrypt config/secrets.yml
# Env vars override: LAB_DB_<NAME>_PASSWORD (e.g. LAB_DB_EXPORTER_PASSWORD).
# The older mysql_<name>_password keys and LAB_MYSQL_<NAME>_PASSWORD env vars still work.
# Minimum 16 characters. Avoid quotes and backslashes.
db_exporter_password: ""
db_replication_password: ""     # async-replication, semi-sync, orchestrator (MySQL); replication user for other engines
db_benchmark_password: ""       # JMeter user
db_admin_password: ""           # cluster admin (innodb-cluster clusteradmin, orchestrator topology user, ...)
