---
# Database engine. Each engine is a descriptor in ansible/engines/<name>/engine.yml.
#   mysql    ready:   async-replication | semi-sync | orchestrator | innodb-cluster | percona-xtradb-cluster
#   mariadb  ready:   async-replication | semi-sync | galera   (maxscale is planned and refused)
#   postgres ready:   streaming-replication | sync-replication | patroni
# A planned engine or strategy is refused at validate time until its roles exist.
db_engine: mysql

# Strategies per engine are listed above; ha/README.md documents each one.
# Provisioning installs the server packages; `make ha` builds the topology.
# percona-xtradb-cluster installs Percona packages instead of Oracle MySQL and forms the cluster during provisioning.
ha_provider: async-replication

# Every lab port defaults to a value that differs from the product's standard port, so the lab can
# sit next to an existing database server, exporter or Galera on the same host. All are overridable below.
mysql:
  version: "8.4"            # "8.4" or "8.0"
  port: 13306               # standard is 3306
  buffer_pool_ratio: 0.5    # share of RAM for InnoDB; use 0.25 or less on servers running other services
  config: {}                # extra my.cnf [mysqld] options for all nodes

# Used when db_engine is mariadb (same keys as the mysql section; port 13306 differs from the standard 3306).
# Per-node server options go under the node's `mariadb:` key in inventory.yml.
mariadb:
  version: "11.4"           # "10.11", "11.4" or "11.8"
  port: 13306
  buffer_pool_ratio: 0.5
  config: {}                # extra [mariadbd] options for all nodes

# Used when db_engine is postgres. One cluster named halab per node; every node is created standalone
# and make ha turns the replicas into streaming standbys of the node with role primary.
postgres:
  version: "17"             # "16", "17" or "18"; installed from apt.postgresql.org (PGDG)
  port: 15432               # standard is 5432
  shared_buffers_ratio: 0.25  # share of RAM for shared_buffers; lower it on servers running other services
  config: {}                # extra postgresql.conf options for all nodes

# sync-replication: the primary waits for acknowledgement from num_sync standbys (ANY n of the other nodes).
# With fewer reachable standbys than num_sync, commits wait; this is the cost of no data loss.
sync_replication:
  num_sync: 1
  commit_level: "on"        # on (standby flushed) | remote_write | remote_apply

# patroni: Patroni runs the halab cluster on every node and fails over by itself; etcd (one member per node,
# TLS with client certificates) is its DCS. Use an odd node count (3 survives one failure). ttl through
# use_pg_rewind are dynamic: make ha applies changes to a running cluster; scope and ports are fixed at deploy.
# Keep loop_wait + 2 * retry_timeout <= ttl.
patroni:
  scope: halab                     # Patroni cluster name (etcd prefix /halab/<scope>/)
  ttl: 30                          # leader key lifetime in seconds: the longest a hung leader blocks failover
  loop_wait: 10
  retry_timeout: 10
  maximum_lag_on_failover: 1048576 # bytes; a replica further behind is never promoted
  synchronous_mode: false          # true: commits wait for a synchronous standby, failover never loses them
  synchronous_node_count: 1
  use_pg_rewind: true              # rewind a failed old leader instead of copying it again
  rest_port: 18008                 # standard 8008; Patroni REST API (TLS)
  etcd_client_port: 12379          # standard 2379
  etcd_peer_port: 12380            # standard 2380

monitoring:
  enabled: true
  node_exporter_port: 19100   # standard 9100
  mysql_exporter_port: 19104  # standard 9104; mysqld_exporter for MySQL and MariaDB
  postgres_exporter_port: 19187  # standard 9187
  lab_collector_port: 19106

replication:
  ssl: true                      # MySQL/MariaDB replication channel uses TLS (auto-generated certs); PostgreSQL always does

semi_sync:
  wait_for_replica_count: 1      # rpl_semi_sync_source_wait_for_replica_count (MariaDB: must be 1)
  timeout_ms: 10000              # after this the source silently falls back to async (MariaDB: rpl_semi_sync_master_timeout)
  wait_point: AFTER_SYNC         # AFTER_SYNC (lossless) | AFTER_COMMIT

orchestrator:
  http_port: 13000               # standard 3000
  raft_port: 13008               # standard 10008
  recovery_period_block_seconds: 60
  instance_poll_seconds: 5

innodb_cluster:
  cluster_name: halab
  recovery_method: clone         # joiners are re-seeded from a donor; their local data is replaced
  router:
    enabled: true                # one MySQL Router per node; clients list every router
    rw_port: 16446               # standard 6446; read-only port is rw_port + 1

percona_xtradb_cluster:
  cluster_name: halab-pxc
  strict_mode: ENFORCING
  gcomm_port: 14567              # standard 4567 (group communication)
  ist_port: 14568                # standard 4568
  sst_port: 14444                # standard 4444
  # encrypt_cluster_traffic: defaults to false on tailscale/vpn networks, forced true on private networks

# MariaDB galera: make provision installs standalone MariaDB; make ha bootstraps the node with role primary
# and joins the others one at a time (each receives an SST copy of it).
mariadb_galera:
  cluster_name: halab-galera
  sst_method: mariabackup        # mariabackup (non-blocking donor) | rsync (no TLS, refused on private networks)
  gcomm_port: 14567              # standard 4567 (group communication)
  ist_port: 14568                # standard 4568
  sst_port: 14444                # standard 4444
  # gtid_domain_id: 1            # wsrep_gtid_domain_id shared by every node
  # encrypt_cluster_traffic: defaults to false on tailscale/vpn networks, forced true on private networks

benchmark:
  enabled: true
