---
# ip: scrape the address resolved on this machine (needed with Docker Desktop, whose containers
# may not resolve MagicDNS). fqdn: scrape by node address as written in inventory.yml.
scrape_address: ip

# Extra sources allowed to reach the database, exporters and HA ports, on top of every node network's cidrs
# (which are always allowed so nodes can replicate). Add this machine's network when it is not on one
# of the node networks, e.g. [192.168.10.0/24] or a VPN client range.
allowed_sources: []

firewall:
  # nftables: lab-owned table `inet halab` guarding only lab ports; other rules untouched (default)
  # ufw:      host-wide default-deny incoming via ufw
  # none:     the lab does not touch the firewall; you enforce ACLs
  backend: nftables
  ssh_allow_all_interfaces: true   # ufw only: false = SSH only on the lab interface

iperf_port: 15201   # standard 5201; used by make network-matrix IPERF=1

exporters:
  node_exporter:
    version: "1.12.1"
  mysqld_exporter:                # MySQL and MariaDB
    version: "0.21.0"
  postgres_exporter:              # PostgreSQL
    version: "0.20.1"
