---
# ip: scrape the address resolved on this machine (needed with Docker Desktop, whose containers
# may not resolve MagicDNS). fqdn: scrape by node address as written in inventory.yml.
scrape_address: ip

# Extra sources allowed to reach MySQL, exporters and HA ports, on top of every node network's cidrs
# (which are always allowed so nodes can replicate). Add this machine's network when it is not on one
# of the node networks, e.g. [192.168.10.0/24] or a VPN client range.
allowed_sources: []

firewall:
  manage: true
  ssh_allow_all_interfaces: true   # false = SSH only on the node's lab interface; lockout risk otherwise

exporters:
  node_exporter:
    version: "1.12.1"
  mysqld_exporter:
    version: "0.21.0"
