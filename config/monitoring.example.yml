---
# ip: scrape Tailscale IPs resolved on this machine (needed with Docker Desktop,
# whose containers may not resolve MagicDNS). fqdn: scrape by MagicDNS name.
scrape_address: ip

# Sources allowed to reach MySQL/exporters (ufw on tailscale0).
# Narrow to this machine's Tailscale IP, e.g. [100.101.102.103/32].
allowed_sources:
  - 100.64.0.0/10
  - fd7a:115c:a1e0::/48

firewall:
  manage: true
  ssh_allow_all_interfaces: true   # false = SSH only via tailscale0; lockout risk if you use the public IP

exporters:
  node_exporter:
    version: "1.12.1"
  mysqld_exporter:
    version: "0.21.0"
