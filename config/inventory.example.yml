---
# Copy to config/inventory.yml (make init).
environment:
  name: lab
  network: tailnet          # node <-> node network (replication, failover); a node can override with network:
  # operator_network: tailnet   # this machine -> nodes (SSH, monitoring, benchmark); default: network

# Networks the nodes are reachable on. Types:
#   tailscale - interface tailscale0, Tailscale ranges; Tailscale must run on node and this machine
#   vpn       - WireGuard/OpenVPN/IPsec you manage; treated as encrypted
#   private   - plain internal network; the lab enforces TLS for replication, clients and Galera
#   direct    - any other plain routed network (LAN, public IPs); same as private
# Mixed networks work when every node can reach every other node and this machine reaches every node.
networks:
  tailnet:
    type: tailscale
  # dc-lan:
  #   type: private
  #   interface: eth1          # interface carrying lab traffic (firewall, faults, PXC address)
  #   cidrs: [10.20.0.0/16]    # subnet(s) of that network; also used for database account host patterns
  # wg:
  #   type: vpn
  #   interface: wg-lab
  #   cidrs: [10.99.0.0/24]

# role: primary | replica. Exactly one primary (initial primary / bootstrap node).
# address: hostname or IP on the node's network (one network), or
# addresses: {network: address} when the node is on several networks (node network + operator network).
# ssh: user (required), port, private_key (omit to use ssh-agent / Tailscale SSH), proxy_jump, become_password_env.
# Optional per node: network, operator_network, server_id, tailscale_ip, the engine's section (mysql:, mariadb: or postgres: {server option: value}).
nodes:
  - name: db-01
    address: db-01.example.ts.net
    ssh: {user: db-ha-lab, private_key: ~/.ssh/db-ha-lab_ed25519}
    role: primary
    datacenter: dc-01

  - name: db-02
    address: db-02.example.ts.net
    ssh: {user: db-ha-lab, private_key: ~/.ssh/db-ha-lab_ed25519}
    role: replica
    datacenter: dc-02

  - name: db-03
    address: db-03.example.ts.net
    ssh: {user: db-ha-lab, private_key: ~/.ssh/db-ha-lab_ed25519}
    role: replica
    datacenter: dc-03
    # network: dc-lan
    # address: 10.20.0.13

  # Replicates over wg; this machine reaches it over the tailnet.
  # - name: db-04
  #   network: wg
  #   operator_network: tailnet
  #   addresses: {wg: 10.99.0.4, tailnet: 100.101.102.104}
  #   role: replica
  #   datacenter: dc-04
  #   ssh: {user: db-ha-lab, private_key: ~/.ssh/db-ha-lab_ed25519}
