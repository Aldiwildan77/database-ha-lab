[defaults]
inventory = ansible/inventory/lab_config.yml
# Core roles, then each engine's own roles (ansible/engines/<engine>/roles).
roles_path = ansible/roles:ansible/engines/mysql/roles:ansible/engines/mariadb/roles:ansible/engines/postgres/roles
collections_path = ansible/collections:~/.ansible/collections
inventory_plugins = ansible/plugins/inventory
interpreter_python = auto_silent
forks = 10
retry_files_enabled = False
callback_result_format = yaml
stdout_callback = default
gathering = implicit

[inventory]
enable_plugins = lab_config
unparsed_is_failed = True

[ssh_connection]
pipelining = True
# Trust-on-first-use: accept new host keys, refuse changed ones.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10

[privilege_escalation]
become = False
